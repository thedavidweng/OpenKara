[package]
name = "openkara-remote"
version = "0.1.0"
description = "Platform-neutral Remote Repository core for OpenKara"
authors = ["OpenKara contributors"]
license = "AGPL-3.0-only"
edition = "2021"

[lib]
name = "openkara_remote"
path = "src/lib.rs"
doctest = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
