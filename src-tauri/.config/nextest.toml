[profile.default]
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 3 }

# Demucs CPU inference is not a hang. The four-stem run over 8x fixture audio
# measures ~126s on a healthy macos-14 runner and crossed the global 180s cap
# on two consecutive main runs (2026-10-23 00:50Z and 01:04Z), turning main
# red for a test that never stalled. Give this binary 4.5 minutes (warn at
# 90s, 180s) and keep the tight hang detector everywhere else.
[[profile.default.overrides]]
filter = 'binary(phase3_inference)'
slow-timeout = { period = "90s", terminate-after = 3 }
