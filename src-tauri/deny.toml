[advisories]
unmaintained = "workspace"
yanked = "warn"
ignore = [
    # plist (via tauri-utils) pins quick-xml ^0.39 for Info.plist parsing at
    # build/bundle time only. OpenKara's runtime TTML parser shares the same
    # crate version until plist widens its requirement.
    { id = "RUSTSEC-2026-0190", reason = "transitive via plist ^0.39 until upstream widens" },
    { id = "RUSTSEC-2026-0194", reason = "transitive via plist ^0.39 until upstream widens" },
    { id = "RUSTSEC-2026-0195", reason = "transitive via plist ^0.39 until upstream widens" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "OpenSSL",
    "BSL-1.0",
    "FTL",
    "MPL-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
