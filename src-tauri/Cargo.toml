[package]
name = "openkara"
version = "0.19.0"
description = "OpenKara desktop shell"
authors = ["OpenKara contributors"]
license = "AGPL-3.0-only"
edition = "2021"
default-run = "openkara"
autotests = false

[workspace]
members = [".", "crates/openkara-remote"]
default-members = [".", "crates/openkara-remote"]
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "openkara_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[features]
# CI-only CLI on the packaged openkara binary (--automation-smoke prepare/...).
# Safe to enable for installed-app product builds: does not add extra bins.
automation-smoke = []
# Separate openkara_automation_driver binary for CI. Must NOT be enabled on
# `tauri build`: Tauri packs every package bin whose features are enabled, and
# a nested driver breaks macOS codesign / pollutes installers.
automation-driver = ["automation-smoke"]

[[bin]]
name = "openkara"
path = "src/main.rs"

[[bin]]
name = "openkara_automation_driver"
path = "src/bin/openkara_automation_driver.rs"
required-features = ["automation-driver"]

[[bin]]
name = "openkara_release_evidence"
path = "src/bin/openkara_release_evidence.rs"
required-features = ["automation-driver"]

# One integration test binary: every file in tests/ is a module of
# tests/integration.rs, so a library change links the application once.
[[test]]
name = "integration"
path = "tests/integration.rs"

[build-dependencies]
cc = "1"
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
aes = "0.9.3"
anyhow = "1.0.104"
biquad = "0.6"
thiserror = "2"
audioadapter-buffers = "5.2.0"
base64 = "0.23.1"
cbc = { version = "0.2.1", features = ["alloc", "block-padding"] }
ctr = "0.10.1"
ecb = { version = "0.2.1", features = ["alloc", "block-padding"] }
hmac = "0.13.0"
cpal = "0.18.2"
libc = "0.2.191"
lofty = "0.25.4"
md-5 = "0.11.0"
num-bigint = "0.5.1"
openkara-remote = { version = "0.1.0", path = "crates/openkara-remote" }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "tracing", "load-dynamic", "api-24", "coreml", "directml", "xnnpack"] }
rand = "0.10.3"
rayon = "1.12.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "cookies", "form", "json", "query", "rustls"] }
ringbuf = "0.5"
ring = "0.17.14"
semver = "1.0.28"
rubato = "5.0.1"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = "1.2.3"
sha1 = "0.11.0"
sha2 = "0.11.1"
symphonia = { version = "0.6.1", default-features = false, features = ["aac", "alac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav", "all-meta"] }
tauri = { version = "2.12.5", features = ["unstable", "protocol-asset"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
tauri-plugin-process = "2.4.0"
tauri-plugin-single-instance = { version = "2.5.4", features = ["deep-link"] }
# Releases use raw NSIS/AppImage payloads; macOS tar support is unconditional.
tauri-plugin-updater = { version = "2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
uuid = { version = "1.28.0", features = ["v4"] }
tiny_http = "0.12.0"
tracing = "0.1"
vorbis_rs = "0.5.6"
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
rquickjs = { version = "0.14.0", features = ["futures", "allocator"] }
regex-lite = "0.1"
unicode-normalization = "0.1"
flate2 = "1.1.10"
tar = "0.4"
time = { version = "0.3.55", features = ["parsing"] }
tokio = { version = "1.54.1", features = ["sync", "rt", "macros", "process", "io-util", "time", "net"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
realfft = "3.5.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
tauri-plugin-notification = "2.7.0"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-deep-link = "2.6.3"

# Every `unsafe` block carries a SAFETY comment. The lint is what keeps that
# true: the FFI bridges are the only unsafe surface in the app, and an
# undocumented block there is the kind of thing that reads as reviewed when it
# was not.
[lints.clippy]
undocumented_unsafe_blocks = "warn"

[dev-dependencies]
filetime = "0.2.29"
hound = "3.5.1"
mockito = "1.7.2"
openkara-remote = { version = "0.1.0", path = "crates/openkara-remote", features = ["testing"] }
tauri = { version = "2.12.5", features = ["test", "unstable"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["sync", "rt", "macros"] }

[profile.release]
strip = true
lto = "fat"
opt-level = "s"
codegen-units = 1

[profile.optimized]
inherits = "release"
strip = false
lto = false
opt-level = 2
codegen-units = 16
incremental = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_System_LibraryLoader",
] }
