[package]
name = "openkara"
version = "0.14.0"
description = "OpenKara desktop shell"
authors = ["OpenKara contributors"]
license = "Apache-2.0"
edition = "2021"
default-run = "openkara"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "openkara_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[features]
# CI-only CLI on the packaged openkara binary (--automation-smoke prepare/...).
# Safe to enable for installed-app product builds: does not add extra bins.
automation-smoke = []
# Separate openkara_automation_driver binary for CI. Must NOT be enabled on
# `tauri build`: Tauri packs every package bin whose features are enabled, and
# a nested driver breaks macOS codesign / pollutes installers.
automation-driver = ["automation-smoke"]

[[bin]]
name = "openkara"
path = "src/main.rs"

[[bin]]
name = "openkara_automation_driver"
path = "src/bin/openkara_automation_driver.rs"
required-features = ["automation-driver"]

[[bin]]
name = "openkara_release_evidence"
path = "src/bin/openkara_release_evidence.rs"
required-features = ["automation-driver"]

[build-dependencies]
cc = "1.2.61"
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
anyhow = "1.0.104"
biquad = "0.6"
thiserror = "2"
audioadapter-buffers = "4.0.0"
base64 = "0.23.0"
cpal = "0.18.1"
libc = "0.2.186"
lofty = "0.24.0"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "tracing", "load-dynamic", "api-24", "coreml", "directml", "xnnpack"] }
rand = "0.10.2"
rayon = "1.12.0"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "query", "rustls"] }
ringbuf = "0.5"
rubato = "5.0.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
schemars = "1.2.1"
sha2 = "0.11.0"
symphonia = { version = "0.6.0", default-features = false, features = ["aac", "alac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav", "all-meta"] }
tauri = { version = "2.11.5", features = ["unstable", "protocol-asset"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-updater = "2.10.1"
uuid = { version = "1.24.0", features = ["v4"] }
tiny_http = "0.12.0"
tracing = "0.1"
vorbis_rs = "0.5.5"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
regex-lite = "0.1"
unicode-normalization = "0.1"
flate2 = "1.1.9"
tar = "0.4"
httpdate = "1.0.3"
tokio = { version = "1.53", features = ["sync"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
realfft = "3.5.0"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tracing-appender = "0.2.3"
tauri-plugin-notification = "2.3.3"
tauri-plugin-window-state = "2.4.1"

# Every `unsafe` block carries a SAFETY comment. The lint is what keeps that
# true: the FFI bridges are the only unsafe surface in the app, and an
# undocumented block there is the kind of thing that reads as reviewed when it
# was not.
[lints.clippy]
undocumented_unsafe_blocks = "warn"

[dev-dependencies]
filetime = "0.2.29"
hound = "3.5.1"
mockito = "1.7.2"
tauri = { version = "2.11.5", features = ["test", "unstable"] }
tempfile = "3.27.0"
tokio = { version = "1.53", features = ["sync", "rt", "macros"] }

[profile.release]
strip = true
lto = "fat"
opt-level = "s"
codegen-units = 1

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_System_LibraryLoader",
] }
