name: Release Please

on:
  push:
    branches: [main]

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create tags, releases, and release-please release PR commits
      pull-requests: write # open and update the running release PR
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
      sha: ${{ steps.rp.outputs.sha }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please bumps package.json and CHANGELOG.md in its release PR.
  # The native manifests (src-tauri/Cargo.toml, Cargo.lock, tauri.conf.json)
  # are propagated by scripts/sync-version.mjs, which runs here after the
  # release is created. Cargo.lock cannot use release-please extra-files
  # because a literal version-string replacement would corrupt unrelated
  # packages that happen to share the same version (e.g. memoffset 0.9.1).
  sync-native-versions:
    name: Sync native manifests
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push the native manifest sync commit to main
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Sync native manifests
        run: node scripts/sync-version.mjs

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Native manifests already in sync"
            exit 0
          fi
          git commit -m "chore(release): sync native manifests for ${TAG_NAME}"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push

  # GITHUB_TOKEN events do not start other workflows. release-please may also
  # leave a draft release with an untagged-* placeholder. Ensure the tag
  # exists, bind the draft release to it, apply the release footer, then
  # dispatch Release explicitly.
  ensure-tag-and-dispatch-release:
    name: Ensure tag and dispatch Release
    needs: [release-please, sync-native-versions]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create missing release tags and rebind draft releases
      actions: write # workflow_dispatch the Release workflow
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure git tag, draft release binding, and release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          set -euo pipefail

          if [ -z "${TAG_NAME}" ]; then
            echo "::error::release-please reported release_created but tag_name is empty"
            exit 1
          fi

          # Annotated tags require a committer identity (same as the sync job).
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Prefer main HEAD after native-manifest sync so the tag tree matches
          # package.json + Cargo.toml. Fall back to release-please's SHA.
          target_sha="$(git rev-parse HEAD)"
          if [ -n "${RELEASE_SHA}" ] && [ "${target_sha}" != "${RELEASE_SHA}" ]; then
            echo "Tagging post-sync main HEAD ${target_sha} (release-please sha was ${RELEASE_SHA})"
          fi

          if git rev-parse -q --verify "refs/tags/${TAG_NAME}" >/dev/null; then
            echo "Local tag ${TAG_NAME} already exists"
          elif git ls-remote --tags origin "refs/tags/${TAG_NAME}" | grep -q .; then
            echo "Remote tag ${TAG_NAME} already exists"
            git fetch origin "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"
          else
            echo "Creating missing tag ${TAG_NAME} at ${target_sha}"
            git tag -a "${TAG_NAME}" "${target_sha}" -m "Release ${TAG_NAME}"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"
            git push origin "refs/tags/${TAG_NAME}"
          fi

          # Draft releases created without a git ref show as untagged-*. Find
          # the release by its exact tag first, then by the name release-please
          # uses for an untagged draft. The tag endpoint cannot find the latter.
          release_id="$(gh api "repos/${GH_REPO}/releases" --paginate \
            --jq "[.[] | select(.draft == true and .tag_name == \"${TAG_NAME}\")] | .[0].id // empty")"
          if [ -z "${release_id}" ]; then
            release_id="$(gh api "repos/${GH_REPO}/releases" --paginate \
              --jq "[.[] | select(.draft == true and (.name == \"${TAG_NAME}\" or .name == \"OpenKara ${TAG_NAME}\"))] | .[0].id // empty")"
          fi
          if [ -z "${release_id}" ]; then
            echo "::error::No draft GitHub Release was found for ${TAG_NAME}."
            exit 1
          fi

          release_endpoint="repos/${GH_REPO}/releases/${release_id}"
          gh api "${release_endpoint}" --jq '.body // empty' > RELEASE_NOTES.md
          if ! grep -Fq "## Installation" RELEASE_NOTES.md; then
            printf '\n\n' >> RELEASE_NOTES.md
            cat .github/release-notes-installation.md >> RELEASE_NOTES.md
          fi

          gh api --method PATCH "${release_endpoint}" \
            -f "tag_name=${TAG_NAME}" \
            -f "target_commitish=${target_sha}" \
            -F "draft=true" \
            -F "body=@RELEASE_NOTES.md" >/dev/null
          echo "Bound draft release ${release_id} to ${TAG_NAME} at ${target_sha}"
          echo "Applied release installation notes to ${TAG_NAME}"

      - name: Dispatch Release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          version="${VERSION}"
          if [ -z "${version}" ]; then
            version="${TAG_NAME#v}"
          fi

          # Prefer an existing in-flight Release run for this tag (tag push or
          # a prior dispatch). A second dispatch doubles builds and races on
          # latest.json / asset uploads.
          existing_run="$(gh run list \
            --repo "${GH_REPO}" \
            --workflow release.yml \
            --branch "${TAG_NAME}" \
            --limit 5 \
            --json databaseId,status,event,url \
            --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "pending" or .status == "waiting")] | .[0].url // empty')"
          if [ -n "${existing_run}" ]; then
            echo "Release workflow already running for ${TAG_NAME}: ${existing_run}"
            echo "Skipping duplicate workflow_dispatch"
            exit 0
          fi

          # workflow_dispatch is started by the API and is not blocked the way
          # push/tag events from GITHUB_TOKEN are. Checkout the tag so package.json
          # matches the release version gate.
          gh workflow run release.yml \
            --repo "${GH_REPO}" \
            --ref "${TAG_NAME}" \
            -f "version=${version}"

          echo "Dispatched Release workflow for ${TAG_NAME} (version ${version})"

  # sync-native-versions advances main with GITHUB_TOKEN. That push does not
  # re-run full CI, so main HEAD can look green while this cut failed on the
  # previous commit. Open an issue so the failure cannot stay silent.
  report-release-cut-failure:
    name: Report release cut failure
    needs:
      [release-please, sync-native-versions, ensure-tag-and-dispatch-release]
    if: >-
      always()
      && needs.release-please.outputs.release_created == 'true'
      && (
        needs.sync-native-versions.result == 'failure'
        || needs.ensure-tag-and-dispatch-release.result == 'failure'
        || needs.ensure-tag-and-dispatch-release.result == 'cancelled'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # open a tracking issue when the release cut fails after merge
    steps:
      - name: Open tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SYNC_RESULT: ${{ needs.sync-native-versions.result }}
          ENSURE_RESULT: ${{ needs.ensure-tag-and-dispatch-release.result }}
        run: |
          set -euo pipefail

          tag="${TAG_NAME:-unknown}"
          title="Release cut failed for ${tag}"
          body="$(cat <<EOF
          The post-merge release cut for \`${tag}\` failed.

          - Workflow run: ${RUN_URL}
          - Sync native manifests: \`${SYNC_RESULT}\`
          - Ensure tag and dispatch Release: \`${ENSURE_RESULT}\`

          Main HEAD can still show green checks after this fails. The sync job
          may push a follow-up commit with \`GITHUB_TOKEN\`, and that push does
          not re-run full CI. Check the Release Please run on the release merge
          commit, not only the latest commit status on \`main\`.

          Repair steps are in \`docs/RELEASING.md\` (create the tag and dispatch
          \`release.yml\` if either is missing).
          EOF
          )"

          existing_issue="$(gh issue list \
            --repo "${GH_REPO}" \
            --state open \
            --search "in:title ${title}" \
            --json number,title \
            --jq '.[0].number // empty')"

          if [ -n "${existing_issue}" ]; then
            gh issue comment "${existing_issue}" --repo "${GH_REPO}" --body "${body}"
            echo "Commented on existing issue #${existing_issue}"
          else
            issue_url="$(gh issue create \
              --repo "${GH_REPO}" \
              --title "${title}" \
              --body "${body}" \
              --label "bug")"
            echo "Opened issue: ${issue_url}"
          fi
