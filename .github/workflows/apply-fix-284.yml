name: Apply issue 284 runtime patch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/284-runtime-bootstrap-termination'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Patch runtime bootstrap integration
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src-tauri/src/commands/runtime_bootstrap.rs')
          text = path.read_text()

          marker = '''fn download_runtime_source(
              catalog_cache: &Arc<Mutex<Option<VerifiedCatalog>>>,
          ) -> CommandResult<(VerifiedCatalog, ())> {'''
          helper = '''fn report_post_download_progress(
              status: &Arc<Mutex<RuntimeBootstrapStatusSnapshot>>,
              emit: &mut impl FnMut(&'static str, RuntimeBootstrapStatusSnapshot),
              base: &RuntimeBootstrapStatusSnapshot,
              state: RuntimeBootstrapState,
          ) {
              let snapshot = RuntimeBootstrapStatusSnapshot {
                  state,
                  downloaded_bytes: None,
                  total_bytes: None,
                  error: None,
                  ..base.clone()
              };
              store_snapshot(status, snapshot.clone());
              emit(RUNTIME_BOOTSTRAP_PROGRESS_EVENT, snapshot);
          }

          '''
          if helper not in text:
              if marker not in text:
                  raise SystemExit('download source marker not found')
              text = text.replace(marker, helper + marker, 1)

          old = '''    let installed = runtime_bootstrap::install_runtime_artifact(
              app_data_dir,
              runtime,
              catalog,
              |downloaded_bytes, total_bytes| {
                  report_download_progress(
                      status,
                      emit,
                      &base,
                      RuntimeBootstrapState::Downloading,
                      downloaded_bytes,
                      total_bytes,
                  );
              },
          )?;

          // Prove the dynamic load BEFORE persisting activation: a runtime whose
          // files verify but whose library cannot load must never become the
          // recorded active runtime (it would report Ready while separation
          // fails, with no recovery path).
          crate::separator::model::ensure_runtime_loaded_from_path(&installed.library_path)
              .with_context(|| {
                  format!(
                      "failed to load ONNX Runtime from {}",
                      installed.library_path.display()
                  )
              })?;
          runtime_bootstrap::activate_first_install(app_data_dir, &installed.record.artifact_id)?;
          '''
          new = '''    let embedded = catalog::embedded_catalog();
              let use_worker = catalog.generation == embedded.generation
                  && catalog.release_id == embedded.release_id;

              let installed = if use_worker {
                  crate::commands::runtime_worker::install_first_runtime(
                      app_data_dir,
                      |progress, download_complete| {
                          if download_complete {
                              report_post_download_progress(
                                  status,
                                  emit,
                                  &base,
                                  RuntimeBootstrapState::Downloading,
                              );
                          } else {
                              report_download_progress(
                                  status,
                                  emit,
                                  &base,
                                  RuntimeBootstrapState::Downloading,
                                  progress.downloaded_bytes,
                                  progress.total_bytes,
                              );
                          }
                      },
                  )?
              } else {
                  let installed = runtime_bootstrap::install_runtime_artifact(
                      app_data_dir,
                      runtime,
                      catalog,
                      |downloaded_bytes, total_bytes| {
                          if total_bytes.is_some_and(|total| {
                              total > 0 && downloaded_bytes >= total
                          }) {
                              report_post_download_progress(
                                  status,
                                  emit,
                                  &base,
                                  RuntimeBootstrapState::Downloading,
                              );
                          } else {
                              report_download_progress(
                                  status,
                                  emit,
                                  &base,
                                  RuntimeBootstrapState::Downloading,
                                  downloaded_bytes,
                                  total_bytes,
                              );
                          }
                      },
                  )?;

                  // Network-refreshed catalog generations are not embedded in the worker
                  // process. Keep their first install in-process, while the shipped
                  // generation uses the killable worker that protects the normal user path.
                  crate::separator::model::ensure_runtime_loaded_from_path(&installed.library_path)
                      .with_context(|| {
                          format!(
                              "failed to load ONNX Runtime from {}",
                              installed.library_path.display()
                          )
                      })?;
                  runtime_bootstrap::activate_first_install(app_data_dir, &installed.record.artifact_id)?;
                  installed
              };

              // The worker proves and activates the runtime in a disposable process. Load
              // the same verified bytes into this process only after that proof succeeds.
              if use_worker {
                  crate::separator::model::ensure_runtime_loaded_from_path(&installed.library_path)
                      .with_context(|| {
                          format!(
                              "failed to load proven ONNX Runtime from {}",
                              installed.library_path.display()
                          )
                      })?;
              }
          '''
          if old not in text:
              if 'runtime_worker::install_first_runtime' not in text:
                  raise SystemExit('first-install block not found')
          else:
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          rm .github/workflows/apply-fix-284.yml
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/commands/runtime_bootstrap.rs src-tauri/src/commands/runtime_worker.rs src-tauri/src/main.rs src-tauri/src/commands/mod.rs .github/workflows/apply-fix-284.yml
          git commit -m "fix(runtime): bound post-download bootstrap"
          git push origin HEAD:${{ github.head_ref }}
