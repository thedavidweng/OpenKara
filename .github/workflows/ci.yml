name: CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MODEL_URL: https://github.com/thedavidweng/openkara-models/releases/download/model-v2.0.1/htdemucs.onnx
  MODEL_SHA256: 8fa3dab679c59aeb049dd229f57a212c9339b3fc17ebf50541daad9e799364a1

jobs:
  prepare-model:
    name: Prepare separation model
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Restore separation model cache
        uses: actions/cache@v4.2.4
        with:
          path: src-tauri/models/htdemucs.onnx
          key: separation-model-${{ env.MODEL_SHA256 }}
          enableCrossOsArchive: true

      - name: Download and verify separation model
        run: ./scripts/setup.sh

      - name: Upload separation model
        uses: actions/upload-artifact@v7.0.1
        with:
          name: separation-model
          path: src-tauri/models/htdemucs.onnx
          if-no-files-found: error
          retention-days: 1

  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.5
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify formatting
        run: pnpm format

      - name: Lint frontend
        run: pnpm lint

      - name: Typecheck frontend
        run: pnpm exec tsc --noEmit

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.5
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.5
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm test

  # Windows uses the DirectML NuGet runtime here because the official CPU
  # onnxruntime.dll imports DXGI at load time on hosted Windows runners. Cargo
  # test binaries start from target/debug/deps, so copy ORT's staged DLLs beside
  # the test executables before running them.
  rust-test:
    name: Rust tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: prepare-model
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            ort_target: aarch64-apple-darwin
          - name: Windows
            os: windows-latest
            ort_target: x86_64-pc-windows-msvc
          - name: Linux
            os: ubuntu-22.04
            ort_target: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Windows VC++ runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'vc_redist.x64.exe'
          $maxRetries = 3
          for ($i = 1; $i -le $maxRetries; $i++) {
            try {
              Invoke-WebRequest -Uri 'https://aka.ms/vc14/vc_redist.x64.exe' -OutFile $installer
              break
            } catch {
              if ($i -eq $maxRetries) { throw }
              Write-Host "Download attempt $i failed, retrying in 10s..."
              Start-Sleep -Seconds 10
            }
          }
          Start-Process -FilePath $installer -ArgumentList '/install', '/quiet', '/norestart' -Wait
          $runtimeKey = 'HKLM:\SOFTWARE\Microsoft\VisualStudio\14.0\VC\Runtimes\x64'
          $runtime = Get-ItemProperty -Path $runtimeKey
          Write-Host "Installed VC++ runtime version: $($runtime.Version)"

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2.9.1
        with:
          shared-key: ${{ github.workflow }}-${{ matrix.os }}
          workspaces: ./src-tauri -> target
          # Include full OS name in cache key to distinguish ubuntu-22.04 from ubuntu-24.04
          key: ${{ matrix.os }}

      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            libasound2-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - name: Download separation model
        uses: actions/download-artifact@v8.0.1
        with:
          name: separation-model
          path: src-tauri/models

      - name: Restore ONNX Runtime cache
        uses: actions/cache@v4.2.4
        with:
          path: src-tauri/generated/onnxruntime
          key: onnxruntime-${{ matrix.ort_target }}-${{ hashFiles('scripts/prepare-onnx-runtime.mjs') }}

      - name: Prepare ONNX Runtime
        run: node scripts/prepare-onnx-runtime.mjs --target "${{ matrix.ort_target }}"

      - name: Inspect Windows ONNX Runtime staging
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/generated/onnxruntime | Format-Table Name, Length
          Get-Content src-tauri/generated/onnxruntime/manifest.json

      - name: Build Windows Rust tests
        if: runner.os == 'Windows'
        working-directory: src-tauri
        run: cargo test -q --no-run

      - name: Stage Windows ONNX Runtime DLLs for tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $destination = 'src-tauri/target/debug/deps'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Copy-Item src-tauri/generated/onnxruntime/*.dll $destination -Force
          Get-ChildItem $destination -Filter '*.dll' | Format-Table Name, Length

      - name: Diagnose Windows DLL dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Find dumpbin via vswhere
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vsPath\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -Last 1

          # Find the test binary
          $testExe = Get-ChildItem src-tauri/target/debug/deps/openkara_lib-*.exe | Select-Object -First 1
          Write-Host "=== Test binary: $($testExe.FullName) ==="

          # Show dependents
          Write-Host "`n=== dumpbin /dependents on test binary ==="
          & $dumpbin /dependents $testExe.FullName

          # Check openkara_lib.dll dependents (the cdylib loaded by the test exe)
          $libDll = 'src-tauri/target/debug/deps/openkara_lib.dll'
          if (Test-Path $libDll) {
            Write-Host "`n=== dumpbin /dependents on openkara_lib.dll ==="
            & $dumpbin /dependents $libDll
          }

          # Show imports from comctl32.dll in the test binary
          Write-Host "`n=== Imports from comctl32.dll in test binary ==="
          & $dumpbin /imports $testExe.FullName | Select-String -Pattern "comctl32" -Context 0,30

          # Show imports from comctl32.dll in openkara_lib.dll
          if (Test-Path $libDll) {
            Write-Host "`n=== Imports from comctl32.dll in openkara_lib.dll ==="
            & $dumpbin /imports $libDll | Select-String -Pattern "comctl32" -Context 0,30
          }

          # Enable loader snaps and try to run the binary to get detailed error
          Write-Host "`n=== Trying to load test binary with LoadLibraryEx ==="
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public class NativeLoader {
            [DllImport("kernel32.dll", SetLastError = true, CharSet = CharSet.Unicode)]
            public static extern IntPtr LoadLibraryEx(string lpFileName, IntPtr hFile, uint dwFlags);

            [DllImport("kernel32.dll")]
            public static extern uint GetLastError();

            [DllImport("kernel32.dll", CharSet = CharSet.Unicode)]
            public static extern uint FormatMessage(uint dwFlags, IntPtr lpSource, uint dwMessageId, uint dwLanguageId, [Out] System.Text.StringBuilder lpBuffer, uint nSize, IntPtr Arguments);
          }
          "@

          $depsDir = (Resolve-Path 'src-tauri/target/debug/deps').Path
          $env:PATH = "$depsDir;$env:PATH"
          $handle = [NativeLoader]::LoadLibraryEx("$depsDir\openkara_lib.dll", [IntPtr]::Zero, 0)
          if ($handle -eq [IntPtr]::Zero) {
            $err = [System.Runtime.InteropServices.Marshal]::GetLastWin32Error()
            $sb = New-Object System.Text.StringBuilder 1024
            [NativeLoader]::FormatMessage(0x1000, [IntPtr]::Zero, [uint32]$err, 0, $sb, 1024, [IntPtr]::Zero) | Out-Null
            Write-Host "LoadLibraryEx failed with error $err : $($sb.ToString())"
          } else {
            Write-Host "LoadLibraryEx succeeded (unexpected)"
          }

          # OS info
          Write-Host "`n=== OS ==="
          (Get-CimInstance Win32_OperatingSystem).Caption
          Write-Host "Build: $((Get-CimInstance Win32_OperatingSystem).BuildNumber)"

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test -q

  tauri-build:
    name: Tauri build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs:
      - prepare-model
      - frontend-quality
      - frontend-build
      - frontend-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            ort_target: aarch64-apple-darwin
          - name: Windows
            os: windows-latest
            ort_target: x86_64-pc-windows-msvc
          - name: Linux
            os: ubuntu-22.04
            ort_target: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.5
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2.9.1
        with:
          shared-key: ${{ github.workflow }}-${{ matrix.os }}
          workspaces: ./src-tauri -> target
          # Include full OS name in cache key to distinguish ubuntu-22.04 from ubuntu-24.04
          key: ${{ matrix.os }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            binutils \
            curl \
            file \
            patchelf \
            libasound2-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Download separation model
        uses: actions/download-artifact@v8.0.1
        with:
          name: separation-model
          path: src-tauri/models

      - name: Restore ONNX Runtime cache
        uses: actions/cache@v4.2.4
        with:
          path: src-tauri/generated/onnxruntime
          key: onnxruntime-${{ matrix.ort_target }}-${{ hashFiles('scripts/prepare-onnx-runtime.mjs') }}

      - name: Prepare ONNX Runtime
        run: node scripts/prepare-onnx-runtime.mjs --target "${{ matrix.ort_target }}"

      - name: Validate Tauri build
        env:
          OPENKARA_GOOGLE_DRIVE_OAUTH_CLIENT_JSON: ${{ secrets.OPENKARA_GOOGLE_DRIVE_OAUTH_CLIENT_JSON }}
          OPENKARA_DROPBOX_APP_KEY: ${{ secrets.OPENKARA_DROPBOX_APP_KEY }}
          OPENKARA_DROPBOX_APP_SECRET: ${{ secrets.OPENKARA_DROPBOX_APP_SECRET }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            pnpm tauri build --ci --bundles deb
          else
            pnpm tauri build --debug --no-bundle --ci
          fi
        shell: bash

      - name: Verify Linux glibc floor
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          find_one() {
            local pattern="$1"
            find src-tauri/target/release -path "$pattern" -print -quit
          }

          max_glibc_version() {
            local binary="$1"
            # Exclude weak undefined symbols — Rust's stdlib weak-imports
            # glibc helpers like pidfd_spawnp / pidfd_getpid that gracefully
            # fall back at runtime and do not create a hard dependency.
            # objdump -T flags field: "  w   DF" for weak, "      DF" for strong.
            objdump -T "$binary" \
              | awk '
                  /  w  .* \*UND\*/ { next }
                  match($0, /GLIBC_[0-9.]+/) {
                    print substr($0, RSTART + 6, RLENGTH - 6)
                  }
                ' \
              | sort -V \
              | tail -1
          }

          assert_glibc_floor() {
            local binary="$1"
            local max_version
            max_version="$(max_glibc_version "$binary")"
            if [ -z "$max_version" ]; then
              echo "No GLIBC symbols found in $binary"
              return
            fi

            echo "$binary: highest strong GLIBC requirement is $max_version"

            if [ "$(printf '%s\n%s\n' "$max_version" "2.35" | sort -V | tail -1)" != "2.35" ]; then
              echo "::error::$binary requires GLIBC_$max_version, which exceeds Ubuntu 22.04's GLIBC_2.35 baseline"
              objdump -T "$binary" | grep "GLIBC_$max_version" | head -5
              exit 1
            fi
          }

          app_binary="$(find_one '*/bundle/deb/*/usr/bin/openkara')"
          ort_binary="$(find_one '*/bundle/deb/*/usr/lib/OpenKara/onnxruntime/libonnxruntime.so')"

          test -n "$app_binary"
          test -n "$ort_binary"

          assert_glibc_floor "$app_binary"
          assert_glibc_floor "$ort_binary"
