name: Reusable macOS installed app smoke

on:
  workflow_call:
    inputs:
      openkara_version:
        description: "Version label reported in the validation summary"
        required: true
        type: string
      artifact_prefix:
        description: "Prefix for all uploaded artifacts"
        required: true
        type: string
      os:
        description: "macOS runner label"
        required: true
        type: string
      rust_target:
        description: "Rust target triple"
        required: true
        type: string
      tauri_target:
        description: "Tauri bundle target triple"
        required: true
        type: string
      updater_target:
        description: "Tauri updater platform key"
        required: false
        type: string
        default: ""
      scenario:
        description: "Automation scenario name"
        required: false
        type: string
        default: "clean-install"
      previous_version:
        description: "Previous release to install before the candidate (empty = latest stable, none = clean install only)"
        required: false
        type: string
        default: ""
      retention_days:
        description: "Artifact retention in days"
        required: false
        type: number
        default: 14
      release_build:
        description: "Build a signed release with updater artifacts"
        required: false
        type: boolean
        default: false
      release_tag:
        description: "Release tag used as the evidence subject"
        required: false
        type: string
        default: ""
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        description: "Minisign private key for updater artifacts"
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        description: "Password for the minisign private key"
        required: false
    outputs:
      validation_passed:
        description: "Whether the installed app validation passed"
        value: ${{ jobs.generate-report.outputs.validation_passed }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-installer:
    name: Build DMG and driver
    runs-on: ${{ inputs.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.13.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: ${{ inputs.rust_target }}

      - name: Restore Rust cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: openkara-macos-release-${{ inputs.tauri_target }}
          workspaces: ./src-tauri -> target
          cache-bin: false
          key: ${{ github.sha }}

      - name: Restore ONNX Runtime cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/generated/onnxruntime
          key: onnxruntime-${{ inputs.tauri_target }}-${{ hashFiles('scripts/prepare-onnx-runtime.mjs', 'src-tauri/catalog/release-manifest.json') }}

      - name: Prepare bundled ONNX Runtime
        env:
          ORT_TARGET: ${{ inputs.tauri_target }}
        run: node scripts/prepare-onnx-runtime.mjs --target "${ORT_TARGET}"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build DMG release candidate with automation smoke entry point
        env:
          CI: true
          RELEASE_BUILD: ${{ inputs.release_build }}
          TAURI_TARGET: ${{ inputs.tauri_target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Product build uses automation-smoke only (CLI on openkara). Do not
          # enable automation-driver: Tauri would pack that second binary into
          # the DMG. Driver is a separate CI artifact in the next step.
          if [ "${RELEASE_BUILD}" = "true" ]; then
            pnpm tauri build --ci --bundles app,dmg --target "${TAURI_TARGET}" --features automation-smoke --config src-tauri/tauri.release.conf.json -- --bin openkara
          else
            pnpm tauri build --ci --bundles dmg --target "${TAURI_TARGET}" --features automation-smoke --no-sign -- --bin openkara
          fi

      - name: Build automation driver
        working-directory: src-tauri
        env:
          RUST_TARGET: ${{ inputs.rust_target }}
        run: cargo build --release --target "${RUST_TARGET}" --features automation-driver --bin openkara_automation_driver --bin openkara_release_evidence

      - name: Upload DMG
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_prefix }}-installer
          path: src-tauri/target/${{ inputs.rust_target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

      - name: Upload automation driver
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_prefix }}-driver
          path: src-tauri/target/${{ inputs.rust_target }}/release/openkara_automation_driver
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

      - name: Upload release evidence driver
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_prefix }}-evidence-driver
          path: src-tauri/target/${{ inputs.rust_target }}/release/openkara_release_evidence
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

      - name: Validate macOS updater artifacts
        if: ${{ inputs.release_build }}
        env:
          BUNDLE_DIR: src-tauri/target/${{ inputs.rust_target }}/release/bundle
        run: |
          set -euo pipefail
          archive="$(find "$BUNDLE_DIR" -type f -name "*.tar.gz" -print -quit)"
          signature="$(find "$BUNDLE_DIR" -type f -name "*.sig" -print -quit)"
          if [ -z "$archive" ]; then
            echo "::error::No macOS updater archive was produced."
            exit 1
          fi
          if [ -z "$signature" ]; then
            echo "::error::No macOS updater signature was produced."
            exit 1
          fi

      - name: Upload macOS updater artifacts
        if: ${{ inputs.release_build }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_prefix }}-updater
          path: |
            src-tauri/target/${{ inputs.rust_target }}/release/bundle/**/*.tar.gz
            src-tauri/target/${{ inputs.rust_target }}/release/bundle/**/*.sig
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  clean-install:
    name: Clean install and smoke
    runs-on: ${{ inputs.os }}
    timeout-minutes: 90
    needs: build-installer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download candidate DMG
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_prefix }}-installer
          path: ${{ runner.temp }}/installer

      - name: Download automation driver
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_prefix }}-driver
          path: ${{ runner.temp }}/driver

      - name: Download release evidence driver
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_prefix }}-evidence-driver
          path: ${{ runner.temp }}/evidence-driver

      - name: Download release updater artifacts
        if: ${{ inputs.release_build }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_prefix }}-updater
          path: ${{ runner.temp }}/updater

      - name: Make driver executable
        env:
          DRIVER_DIR: ${{ runner.temp }}/driver
        run: chmod +x "$DRIVER_DIR/openkara_automation_driver"

      - name: Install previous stable then upgrade to candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INSTALL_DIR: ${{ runner.temp }}/OpenKara-installed-smoke
          CANDIDATE_DIR: ${{ runner.temp }}/installer
          PREVIOUS_VERSION: ${{ inputs.previous_version }}
        run: |
          set -euo pipefail
          mkdir -p "$INSTALL_DIR"

          candidate_dmg=$(find "$CANDIDATE_DIR" -name "*.dmg" -type f | head -n 1)
          if [ -z "$candidate_dmg" ]; then
            echo "::error::The candidate DMG was not produced."
            exit 1
          fi

          previous_version="$PREVIOUS_VERSION"
          if [ "$previous_version" != "none" ]; then
            if [ -z "$previous_version" ]; then
              release=$(gh api "repos/$GH_REPO/releases" --paginate --jq '[.[] | select(.draft == false and .prerelease == false)] | sort_by(.published_at) | last | .tag_name')
            else
              release="$previous_version"
            fi

            if [ -n "$release" ] && [ "$release" != "null" ]; then
              previous_dir="${RUNNER_TEMP}/openkara-previous-release"
              mkdir -p "$previous_dir"
              gh release download "$release" --repo "$GH_REPO" --pattern "*.dmg" --dir "$previous_dir" || true
              previous_dmg=$(find "$previous_dir" -name "*.dmg" -type f | head -n 1)
              if [ -n "$previous_dmg" ]; then
                previous_mount="${RUNNER_TEMP}/openkara-previous-mount"
                mkdir -p "$previous_mount"
                hdiutil attach "$previous_dmg" -mountpoint "$previous_mount" -nobrowse
                cp -R "$previous_mount"/*.app "$INSTALL_DIR/"
                hdiutil detach "$previous_mount"
              else
                echo "::warning::Release $release did not include a macOS DMG; continuing with clean candidate install."
              fi
            else
              echo "::warning::No previous version resolved; continuing with clean candidate install."
            fi
          fi

          candidate_mount="${RUNNER_TEMP}/openkara-candidate-mount"
          mkdir -p "$candidate_mount"
          hdiutil attach "$candidate_dmg" -mountpoint "$candidate_mount" -nobrowse
          cp -R "$candidate_mount"/*.app "$INSTALL_DIR/"
          hdiutil detach "$candidate_mount"

          installed_app=$(find "$INSTALL_DIR" -name "openkara" -type f -path "*/Contents/MacOS/*" | head -n 1)
          if [ -z "$installed_app" ]; then
            echo "::error::openkara binary was not found inside the installed .app."
            exit 1
          fi
          echo "OPENKARA_INSTALLED_APP=$installed_app" >> "$GITHUB_ENV"

      - name: Run installed-app scenario
        env:
          OPENKARA_SMOKE_EP: cpu
          OPENKARA_SCENARIO: ${{ inputs.scenario }}
          SMOKE_ROOT: ${{ runner.temp }}/openkara-installed-app-smoke
        run: |
          set -euo pipefail
          mkdir -p "$SMOKE_ROOT"/{app-data,input,prepare,restart}
          cp src-tauri/tests/fixtures/audio/fixture.wav "$SMOKE_ROOT/input/fixture.wav"

          driver="${RUNNER_TEMP}/driver/openkara_automation_driver"
          "$driver" --scenario "$OPENKARA_SCENARIO" --installed-exe "$OPENKARA_INSTALLED_APP" --app-data-dir "$SMOKE_ROOT/app-data" --input-dir "$SMOKE_ROOT/input" --output-dir "$SMOKE_ROOT"

      - name: Validate installed app smoke
        env:
          SMOKE_ROOT: ${{ runner.temp }}/openkara-installed-app-smoke
        run: |
          set -euo pipefail
          evidence_driver="${RUNNER_TEMP}/evidence-driver/openkara_release_evidence"
          chmod +x "$evidence_driver"
          "$evidence_driver" validate-automation-report \
            --input "$SMOKE_ROOT/automation-report.json" \
            --output "$SMOKE_ROOT/installed-app-smoke-validation.json"

      - name: Generate Rust release evidence fragment
        if: ${{ always() && inputs.release_build }}
        env:
          SMOKE_ROOT: ${{ runner.temp }}/openkara-installed-app-smoke
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_VERSION: ${{ inputs.openkara_version }}
          RELEASE_PLATFORM: ${{ inputs.updater_target }}
          RELEASE_SCENARIO: ${{ inputs.scenario }}
        run: |
          set -euo pipefail
          evidence_driver="${RUNNER_TEMP}/evidence-driver/openkara_release_evidence"
          chmod +x "$evidence_driver"
          candidate_dmg=$(find "${RUNNER_TEMP}/installer" -name "*.dmg" -type f | head -n 1)
          artifact_args=(--artifact "installer:${RELEASE_PLATFORM}:${candidate_dmg}")
          while IFS= read -r -d '' artifact; do
            artifact_args+=(--artifact "updater-${artifact##*/}:${RELEASE_PLATFORM}:${artifact}")
          done < <(find "${RUNNER_TEMP}/updater" -type f \( -name "*.tar.gz" -o -name "*.sig" \) -print0)
          "$evidence_driver" fragment-from-automation-report \
            --input "$SMOKE_ROOT/automation-report.json" \
            --repository "$GITHUB_REPOSITORY" \
            --commit-sha "$GITHUB_SHA" \
            --tag "$RELEASE_TAG" \
            --version "$RELEASE_VERSION" \
            --platform "$RELEASE_PLATFORM" \
            --scenario "$RELEASE_SCENARIO" \
            "${artifact_args[@]}" \
            --output "$SMOKE_ROOT/release-evidence-fragment.json"

      - name: Upload smoke reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_prefix }}-smoke-reports
          path: |
            ${{ runner.temp }}/openkara-installed-app-smoke/**/installed-app-smoke-report.json
            ${{ runner.temp }}/openkara-installed-app-smoke/**/installed-app-smoke-validation.json
            ${{ runner.temp }}/openkara-installed-app-smoke/**/automation-report.json
            ${{ runner.temp }}/openkara-installed-app-smoke/**/release-evidence-fragment.json
            ${{ runner.temp }}/openkara-installed-app-smoke/**/local-audio-smoke-report.*
          if-no-files-found: warn
          retention-days: ${{ inputs.retention_days }}

  generate-report:
    name: Generate validation report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: clean-install
    outputs:
      validation_passed: ${{ steps.summarize.outputs.passed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download smoke reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_prefix }}-smoke-reports
          path: ${{ runner.temp }}/smoke-reports

      - name: Summarize validation
        id: summarize
        env:
          SMOKE_REPORTS_DIR: ${{ runner.temp }}/smoke-reports
        run: |
          set -euo pipefail
          validation_path=$(find "$SMOKE_REPORTS_DIR" -name "installed-app-smoke-validation.json" -type f | head -n 1)
          if [ -z "$validation_path" ]; then
            echo "::error::Validation report not found"
            exit 1
          fi

          export VALIDATION_PATH="$validation_path"
          pass=$(node -p "require(process.env.VALIDATION_PATH).fail_count === 0")
          echo "passed=$pass" >> "$GITHUB_OUTPUT"

          {
            echo "# macOS installed-app smoke validation"
            echo ""
            node -e "
              const fs = require('fs');
              const v = JSON.parse(fs.readFileSync(process.env.VALIDATION_PATH, 'utf8'));
              console.log(\`Pass: \${v.pass_count}, Fail: \${v.fail_count}, Total: \${v.assertions.length}\`);
            "
          } >> "$GITHUB_STEP_SUMMARY"
