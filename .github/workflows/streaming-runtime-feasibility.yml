name: Streaming runtime feasibility candidate

on:
  push:
    branches:
      - feat/551-streaming-source-plugins
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streaming-runtime-feasibility-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: Require repository owner branch invocation
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          OWNER: ${{ github.repository_owner }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          test "$ACTOR" = "$OWNER"
          test "$TRIGGERING_ACTOR" = "$OWNER"
          test "$REPOSITORY" = thedavidweng/OpenKara
          test "$REF" = refs/heads/feat/551-streaming-source-plugins
          test "$REF_TYPE" = branch

  macos:
    needs: authorize
    uses: ./.github/workflows/reusable-macos-installed-app-smoke.yml
    with:
      openkara_version: feasibility-553
      artifact_prefix: feasibility-553-macos-arm64
      os: macos-latest
      rust_target: aarch64-apple-darwin
      tauri_target: aarch64-apple-darwin
      updater_target: darwin-aarch64
      previous_version: none
      release_build: true
      streaming_runtime_smoke: true
      retention_days: 14
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}

  windows:
    needs: authorize
    uses: ./.github/workflows/reusable-windows-installed-app.yml
    with:
      openkara_version: feasibility-553
      artifact_prefix: feasibility-553-windows-x64
      previous_version: none
      # Hosted Windows disables Defender RTP and excludes whole drives. Run
      # the installed candidate on a protected native machine for #553.
      streaming_runtime_smoke: false
      retention_days: 14
