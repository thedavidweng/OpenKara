name: One-shot restore PR 176 runtime fixture

on:
  push:
    branches: [perf/bounded-separation-171]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: perf/bounded-separation-171
          fetch-depth: 0
      - name: Restore explicit runtime initialization
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src-tauri/tests/phase3_inference.rs')
          text = path.read_text()
          marker = '''fn model_path() -> PathBuf {
              PathBuf::from(env!("CARGO_MANIFEST_DIR"))
                  .join("models")
                  .join("htdemucs.onnx")
          }
          '''
          replacement = marker + '''
          fn initialize_test_runtime() {
              let runtime_path = PathBuf::from(env!("CARGO_MANIFEST_DIR"))
                  .join("generated")
                  .join("onnxruntime")
                  .join(model::ORT_RUNTIME_FILENAME);
              model::ensure_runtime_loaded_from_path(&runtime_path)
                  .expect("CI-prepared runtime should initialize explicitly for inference tests");
          }
          '''
          if marker not in text:
              raise SystemExit('model_path marker not found')
          text = text.replace(marker, replacement, 1)
          helper = '''fn separate_four_stem_to_dir(
              decoded: openkara_lib::audio::decode::DecodedAudio,
              output_dir: &Path,
          ) -> openkara_lib::audio::decode::DecodedAudio {
              let loaded_model = model::load_from_path(&model_path(), ExecutionProviderPreference::Cpu)
          '''
          helper_replacement = '''fn separate_four_stem_to_dir(
              decoded: openkara_lib::audio::decode::DecodedAudio,
              output_dir: &Path,
          ) -> openkara_lib::audio::decode::DecodedAudio {
              initialize_test_runtime();
              let loaded_model = model::load_from_path(&model_path(), ExecutionProviderPreference::Cpu)
          '''
          if helper not in text:
              raise SystemExit('separation helper marker not found')
          path.write_text(text.replace(helper, helper_replacement, 1))
          PY
          rm .github/workflows/one-shot-runtime-fixture-176.yml
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/tests/phase3_inference.rs .github/workflows/one-shot-runtime-fixture-176.yml
          git commit -m 'test(separator): initialize runtime in streaming inference tests'
          git push origin HEAD:perf/bounded-separation-171
