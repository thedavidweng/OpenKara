name: Packaging

on:
  pull_request:
    paths:
      - ".github/workflows/packaging.yml"
      - "package.json"
      - "packaging/**"
      - "pnpm-lock.yaml"
      - "scripts/prepare-onnx-runtime.mjs"
      - "scripts/render-*.mjs"
      - "scripts/release-metadata.mjs"
      - "src-tauri/Cargo.lock"
      - "src-tauri/Cargo.toml"
      - "src-tauri/tauri.conf.json"
      - "tests/flatpak-packaging.test.ts"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/packaging.yml"
      - "package.json"
      - "packaging/**"
      - "pnpm-lock.yaml"
      - "scripts/prepare-onnx-runtime.mjs"
      - "scripts/render-*.mjs"
      - "scripts/release-metadata.mjs"
      - "src-tauri/Cargo.lock"
      - "src-tauri/Cargo.toml"
      - "src-tauri/tauri.conf.json"
      - "tests/flatpak-packaging.test.ts"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Classify changed files to gate expensive packaging builds. The
  # classifier (scripts/ci/classify-changes.mjs) is the single source of
  # truth shared with the main CI workflow.
  triage:
    name: Triage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      packaging_inputs: ${{ steps.classify.outputs.packaging_inputs }}
      packaging_workflow: ${{ steps.classify.outputs.packaging_workflow }}
      release_metadata: ${{ steps.classify.outputs.release_metadata }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Collect changed files
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            gh api --paginate --jq '.[].filename' \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
              > changed-files.txt
          elif [ "$EVENT_NAME" = "push" ]; then
            # Use the GitHub API instead of git diff: the checkout is shallow
            # (fetch-depth: 1) so the BEFORE SHA is not in local history.
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              gh api --jq '.files[].filename' \
                "repos/${GITHUB_REPOSITORY}/commits/${AFTER}" \
                > changed-files.txt
            else
              gh api --paginate --jq '.files[].filename' \
                "repos/${GITHUB_REPOSITORY}/compare/${BEFORE}...${AFTER}" \
                > changed-files.txt
            fi
          else
            : > changed-files.txt
          fi

      - name: Classify changes
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          node scripts/ci/classify-changes.mjs \
            --files "$(cat changed-files.txt)" \
            --event "$EVENT_NAME" \
            > classification.json

          # Check whether packaging-impacting categories are present.
          cats=$(jq -r '.categories | join(",")' classification.json)
          echo "packaging_inputs=$(echo "$cats" | grep -q 'packaging_inputs' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "packaging_workflow=$(echo "$cats" | grep -q 'packaging_workflow' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "release_metadata=$(echo "$cats" | grep -q 'release_metadata' && echo true || echo false)" >> "$GITHUB_OUTPUT"

  validate-winget:
    name: Validate WinGet manifests
    needs: triage
    if: |
      !cancelled() &&
      (needs.triage.outputs.packaging_inputs == 'true' ||
       needs.triage.outputs.packaging_workflow == 'true' ||
       needs.triage.outputs.release_metadata == 'true' ||
       github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Resolve latest public release version
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(gh release list --repo "${GITHUB_REPOSITORY}" --limit 1 --json tagName --jq '.[0].tagName | sub("^v"; "")')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Render WinGet manifests from current public release
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          # Authenticate GitHub API calls inside release-metadata.mjs so the
          # unauthenticated rate limit (60 req/h per IP) is not exhausted on
          # shared GitHub Actions runners. Without this the render step fails
          # with "403 rate limit exceeded".
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/render-winget-manifests.mjs --version "$env:RELEASE_VERSION" --output "$env:GITHUB_WORKSPACE/dist/winget"

      - name: Install latest WinGet client
        shell: pwsh
        run: |
          $progressPreference = 'silentlyContinue'
          # GitHub Windows images no longer resolve the legacy NuGet PackageProvider bootstrap reliably.
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Microsoft.WinGet.Client -Force -Repository PSGallery -Scope CurrentUser | Out-Null
          Import-Module Microsoft.WinGet.Client
          Repair-WinGetPackageManager -Force -Latest
          winget --version

      - name: Validate WinGet manifests
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          winget validate --manifest "$env:GITHUB_WORKSPACE/dist/winget/t/thedavidweng/OpenKara/$env:RELEASE_VERSION"

  validate-flatpak:
    name: Validate Flatpak metadata
    needs: triage
    if: |
      !cancelled() &&
      (needs.triage.outputs.packaging_inputs == 'true' ||
       needs.triage.outputs.packaging_workflow == 'true' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.13.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Install Flatpak validators
        run: |
          # This job stays on the Ubuntu host because pnpm/node tooling is easier
          # to install here than inside the Flathub container. Only lightweight
          # metadata checks run here:
          #   - appstream for `appstreamcli validate`
          #   - flatpak-builder for `--show-manifest` (pure YAML parse, no build)
          # The actual Flatpak build runs in the separate `build-flatpak` job
          # inside the ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
          # container, which is the supported Flatpak CI environment.
          sudo apt-get update
          sudo apt-get install -y appstream flatpak-builder

      - name: Validate Flatpak packaging invariants
        run: node --run test -- tests/flatpak-packaging.test.ts

      - name: Validate upstream AppStream metadata
        run: |
          appstreamcli validate packaging/flatpak/io.github.thedavidweng.OpenKara.metainfo.xml

      - name: Render Flatpak manifests from current checkout
        env:
          SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          version="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          node scripts/render-flatpak-manifest.mjs \
            --version "${version}" \
            --source-url "https://github.com/${SOURCE_REPO}/archive/${SOURCE_SHA}.tar.gz" \
            --output "${GITHUB_WORKSPACE}/dist/flatpak"

      - name: Validate Flatpak manifest syntax
        run: |
          flatpak-builder --show-manifest "${GITHUB_WORKSPACE}/dist/flatpak/io.github.thedavidweng.OpenKara/io.github.thedavidweng.OpenKara.yml" > /dev/null

      - name: Upload rendered Flatpak manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak-manifest
          path: dist/flatpak
          if-no-files-found: error
          retention-days: 1

  build-flatpak:
    name: Build Flatpak (x86_64)
    needs: [triage, validate-flatpak]
    # Only build Flatpak from source when packaging inputs or the packaging
    # workflow itself changed — not for release-metadata-only or
    # workflow_dispatch validation runs.
    if: |
      !cancelled() &&
      needs.validate-flatpak.result == 'success' &&
      (needs.triage.outputs.packaging_inputs == 'true' ||
       needs.triage.outputs.packaging_workflow == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Run inside the Flathub-maintained container. This image ships a
    # pre-configured flatpak + flatpak-builder + flatpak-builder-lint + flathub
    # remote + gnome-50 SDK, which is the environment every Flathub-hosted app
    # builds in. Earlier attempts to run `flatpak-builder` (from apt) or
    # `flatpak run org.flatpak.Builder` on the Ubuntu host ran into multiple
    # layers of sandbox nesting that Flatpak does not actually support in CI
    # (missing appstream-compose, D-Bus autolaunch, and per-app flatpak user
    # dir vs build-init visibility mismatches). `--privileged` is required so
    # bubblewrap can operate inside the container. This mirrors the shape used
    # in flathub-infra/actions-images' own test workflow.
    #
    # Disk headroom: Flatpak SDK + cargo + node sources overflow the default
    # GHA runner disk on PR builds. We bind-mount ONLY the host toolchain
    # directories we intend to delete (not the whole host root), reclaim that
    # space inside the job container, and disable flatpak-builder ccache
    # restore/upload (unique-per-SHA keys are cache misses that only waste
    # space). `--privileged` remains required for bubblewrap in this image.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50@sha256:5767ab6266c0680cbe827f17b41a8120ac02c6a09bf5feced438831e57425c68
      options: >-
        --privileged
        --dns 8.8.8.8
        --dns 1.1.1.1
        -v /usr/share/dotnet:/host-cleanup/dotnet
        -v /usr/local/lib/android:/host-cleanup/android
        -v /usr/local/share/powershell:/host-cleanup/powershell
        -v /opt/ghc:/host-cleanup/ghc
        -v /usr/local/.ghcup:/host-cleanup/ghcup
        -v /opt/hostedtoolcache/CodeQL:/host-cleanup/codeql
        -v /usr/share/swift:/host-cleanup/swift
        -v /usr/local/share/chromium:/host-cleanup/chromium

    steps:
      - name: Free host disk space
        run: |
          # Reclaim only the bind-mounted unused host toolchains listed in
          # container.options. Paths are intentionally narrow — never mount /.
          # Delete *inside* each mount (not the mount-point dir itself) so we
          # avoid "Device or resource busy" on the bind root while still
          # reclaiming multi-GB toolchain trees.
          set -euo pipefail
          echo "=== disk before free ==="
          df -h
          if [ -d /host-cleanup ]; then
            for mount in /host-cleanup/*; do
              [ -d "$mount" ] || continue
              find "$mount" -mindepth 1 -maxdepth 1 -exec rm -rf {} + || true
            done
          fi
          echo "=== disk after free ==="
          df -h

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Download rendered Flatpak manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flatpak-manifest
          path: dist/flatpak

      - name: Disk report (pre-build)
        run: df -h

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb # v6.7
        with:
          bundle: openkara.flatpak
          manifest-path: dist/flatpak/io.github.thedavidweng.OpenKara/io.github.thedavidweng.OpenKara.yml
          cache: "false"
          upload-artifact: "false"
          arch: x86_64
          verbose: true
          # Required for `flatpak-builder-lint builddir/repo` to pass
          # `appstream-external-screenshot-url`. The action internally passes
          # `--mirror-screenshots-url=<value> --compose-url-policy=full` to
          # flatpak-builder, which rewrites the <screenshot> URLs in the
          # composed appstream XML to dl.flathub.org/media/* and commits a
          # `screenshots/<arch>` OSTree ref into the repo. The actual static
          # files are served by dl.flathub.org only after a Flathub submission,
          # but the rewriting is what the linter requires at build time.
          # Omitting this input makes the lint step fail with
          # "appstream-external-screenshot-url: Screenshots are not mirrored to
          # https://dl.flathub.org/media".
          mirror-screenshots-url: https://dl.flathub.org/media

      - name: Disk report (post-build)
        if: always()
        run: df -h

      - name: Run Flatpak builder lint
        run: |
          flatpak-builder-lint --exceptions --debug manifest dist/flatpak/io.github.thedavidweng.OpenKara/io.github.thedavidweng.OpenKara.yml
          flatpak-builder-lint --exceptions --debug builddir flatpak_app
          flatpak-builder-lint --exceptions --debug repo repo
