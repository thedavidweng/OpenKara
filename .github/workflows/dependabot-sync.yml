name: Dependabot auto-sync

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read # check the PR trigger user

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync lockfile and Flatpak sources
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # push regenerated lockfile and Flatpak sources to the PR branch

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      # RATIONALE: Both Flatpak generators use only Node built-ins and
      # checked-in lockfiles; no pnpm install is needed. Running
      # `pnpm install` in a job with `contents: write` and push access
      # would needlessly execute lifecycle scripts from third-party
      # packages with write credentials, which is a supply-chain risk.
      - name: Regenerate Flatpak node sources
        run: node scripts/generate-flatpak-node-sources.mjs

      - name: Regenerate Flatpak Cargo sources
        run: node scripts/generate-flatpak-cargo-sources.mjs

      - name: Verify Cargo sources are in sync
        run: |
          if ! git diff --quiet packaging/flatpak/generated/cargo-sources.json; then
            echo "::error::Cargo sources are stale after regeneration"
            git diff --stat packaging/flatpak/generated/cargo-sources.json
            exit 1
          fi

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packaging/flatpak/generated/node-sources.0.json pnpm-lock.yaml packaging/flatpak/generated/cargo-sources.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: sync lockfile and Flatpak sources for dependabot update"
            git push
          fi
