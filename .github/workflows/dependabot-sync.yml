name: Dependabot auto-sync

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read # check the PR trigger user

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync lockfile and Flatpak sources
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # push regenerated lockfile and Flatpak sources to the PR branch
      actions: write # approve the CI run triggered by the sync push

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # RATIONALE: Both Flatpak generators use only Node built-ins and
      # checked-in lockfiles; no pnpm install is needed. Running
      # `pnpm install` in a job with `contents: write` and push access
      # would needlessly execute lifecycle scripts from third-party
      # packages with write credentials, which is a supply-chain risk.
      - name: Regenerate Flatpak node sources
        run: node scripts/generate-flatpak-node-sources.mjs

      - name: Regenerate Flatpak Cargo sources
        run: node scripts/generate-flatpak-cargo-sources.mjs

      # RATIONALE: Stage and commit *before* any verification. For an ordinary
      # Dependabot Cargo update, regenerating from the changed Cargo.lock is
      # *supposed* to change cargo-sources.json. A staleness check placed
      # between regeneration and the auto-commit would exit before the commit
      # step, so future stale manifests could never be auto-synced. The
      # idempotence/staleness verification lives in the read-only PR test
      # (tests/flatpak-packaging.test.ts) instead.
      - name: Commit changes if any
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packaging/flatpak/generated/node-sources.0.json pnpm-lock.yaml packaging/flatpak/generated/cargo-sources.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: sync lockfile and Flatpak sources for dependabot update"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # RATIONALE: A push via GITHUB_TOKEN triggers a pull_request
      # synchronize event, but GitHub marks EVERY resulting workflow run
      # action_required (GITHUB_TOKEN-triggered events do not auto-run
      # workflows). Any unapproved run — Packaging, this workflow's own
      # rerun, CI — keeps the PR "unstable" and blocks auto-merge forever,
      # so approve all of them, then confirm a clean sweep before exiting.
      - name: Approve triggered workflow runs
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          # The synchronize event takes a few seconds to register the runs.
          approved=0
          for attempt in $(seq 1 12); do
            pending=$(gh run list \
              --branch="$BRANCH" \
              --status=action_required \
              --json databaseId \
              --jq '.[].databaseId')
            if [ -z "$pending" ]; then
              if [ "$approved" -gt 0 ]; then
                echo "All triggered workflow runs approved"
                exit 0
              fi
              echo "No action_required runs yet (attempt $attempt/12), retrying in 5s..."
            else
              for run_id in $pending; do
                echo "Approving run $run_id"
                gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/approve"
                approved=$((approved + 1))
              done
            fi
            sleep 5
          done
          if [ "$approved" -eq 0 ]; then
            echo "::warning::No action_required runs found after 60s — workflows may need manual approval."
          else
            echo "::warning::Approved ${approved} run(s) but some action_required runs remain — check manually."
          fi
