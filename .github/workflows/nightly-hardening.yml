name: Nightly hardening

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-hardening-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  windows-matrix:
    name: Windows UI ${{ matrix.test }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: accessibility
          - test: smoke
          - test: ui
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.13.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium webkit

      - name: Run ${{ matrix.test }} tests
        shell: pwsh
        env:
          TEST_TYPE: ${{ matrix.test }}
          OKA_ACCESSIBILITY_MATRIX: ${{ matrix.test == 'accessibility' && '1' || '0' }}
        run: |
          switch ($env:TEST_TYPE) {
            "accessibility" { pnpm test:a11y:matrix }
            "smoke" { pnpm exec playwright test --project=chromium-smoke --project=webkit-smoke }
            "ui" { pnpm exec playwright test --project=chromium-ui --project=webkit-ui }
            default { throw "Unknown test type: $env:TEST_TYPE" }
          }

      - name: Upload ${{ matrix.test }} report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-windows-ui-${{ matrix.test }}
          path: playwright-report
          if-no-files-found: error
          retention-days: 7

  # Full quality matrix (docs/CI_LAYERS.md). Release reuses recent green
  # Nightly evidence and only re-runs product packaging + Windows #284 core.
  separation-smoke:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Nightly Linux x64 smoke
            os: ubuntu-22.04
            ort_target: x86_64-unknown-linux-gnu
            artifact_prefix: nightly-separation-smoke-x86_64-linux
          - name: Nightly Linux arm64 smoke
            os: ubuntu-24.04-arm
            ort_target: aarch64-unknown-linux-gnu
            artifact_prefix: nightly-separation-smoke-aarch64-linux
          - name: Nightly macOS Apple Silicon smoke
            os: macos-14
            ort_target: aarch64-apple-darwin
            artifact_prefix: nightly-separation-smoke-aarch64-apple
          - name: Nightly macOS Intel smoke
            os: macos-15-intel
            ort_target: x86_64-apple-darwin
            artifact_prefix: nightly-separation-smoke-x86_64-apple
    uses: ./.github/workflows/reusable-separation-smoke.yml
    with:
      name: ${{ matrix.name }}
      os: ${{ matrix.os }}
      ort_target: ${{ matrix.ort_target }}
      artifact_prefix: ${{ matrix.artifact_prefix }}
      retention_days: 7

  windows-installed-app:
    name: Windows installed app smoke
    uses: ./.github/workflows/reusable-windows-installed-app.yml
    with:
      openkara_version: "0.0.0-nightly"
      artifact_prefix: nightly-windows-installed-app
      driver_scenario: clean-install
      uia_scenario: keyboard-workflow
      run_keyboard_uia: true
      run_fault_injection: true
      run_display_matrix: true
      previous_version: none
      retention_days: 30

  macos-installed-app:
    name: macOS installed app smoke (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            os: macos-14
            rust_target: aarch64-apple-darwin
            tauri_target: aarch64-apple-darwin
            artifact_prefix: nightly-macos-installed-app-aarch64
          - name: Intel
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
            tauri_target: x86_64-apple-darwin
            artifact_prefix: nightly-macos-installed-app-x86_64
    uses: ./.github/workflows/reusable-macos-installed-app-smoke.yml
    with:
      openkara_version: "0.0.0-nightly"
      artifact_prefix: ${{ matrix.artifact_prefix }}
      os: ${{ matrix.os }}
      rust_target: ${{ matrix.rust_target }}
      tauri_target: ${{ matrix.tauri_target }}
      scenario: clean-install
      previous_version: none
      retention_days: 7

  linux-installed-app:
    name: Linux installed app smoke (x64)
    uses: ./.github/workflows/reusable-linux-installed-app-smoke.yml
    with:
      openkara_version: "0.0.0-nightly"
      artifact_prefix: nightly-linux-installed-app-x86_64
      os: ubuntu-22.04
      rust_target: x86_64-unknown-linux-gnu
      tauri_target: x86_64-unknown-linux-gnu
      scenario: clean-install
      previous_version: none
      retention_days: 7

  aggregate-reports:
    name: Create Nightly evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: always()
    needs:
      - windows-matrix
      - separation-smoke
      - windows-installed-app
      - macos-installed-app
      - linux-installed-app
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create commit-bound Nightly evidence
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          node scripts/ci/nightly-evidence.mjs create \
            --commit "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --needs-json "${NEEDS_JSON}" \
            --output nightly-evidence.json

      - name: Upload Nightly evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-evidence
          path: nightly-evidence.json
          if-no-files-found: error
          retention-days: 30
