name: Nightly hardening

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-hardening-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  windows-matrix:
    name: Windows UI ${{ matrix.test }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: accessibility
            files: tests/e2e/accessibility.spec.ts
          - test: smoke
            files: tests/e2e/smoke.spec.ts
          - test: ui
            files: tests/e2e
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.13.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium webkit

      - name: Run ${{ matrix.test }} tests
        shell: pwsh
        env:
          TEST_TYPE: ${{ matrix.test }}
          TEST_FILES: ${{ matrix.files }}
        run: |
          $ErrorActionPreference = "Stop"
          $base = "tests/e2e"
          switch ($env:TEST_TYPE) {
            "accessibility" {
              pnpm exec playwright test $env:TEST_FILES
            }
            "smoke" {
              pnpm exec playwright test $env:TEST_FILES
            }
            "ui" {
              $files = (Get-ChildItem -Path $base -Filter "*.spec.ts" | Where-Object { $_.Name -ne "accessibility.spec.ts" -and $_.Name -ne "smoke.spec.ts" }).FullName
              pnpm exec playwright test $files
            }
            default {
              throw "Unknown test type: $env:TEST_TYPE"
            }
          }

  separation-smoke:
    name: ${{ matrix.name }}
    needs: []
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Nightly Linux x64 smoke
            os: ubuntu-22.04
            ort_target: x86_64-unknown-linux-gnu
            artifact_prefix: nightly-separation-smoke-x86_64-linux
          - name: Nightly Linux arm64 smoke
            os: ubuntu-24.04-arm
            ort_target: aarch64-unknown-linux-gnu
            artifact_prefix: nightly-separation-smoke-aarch64-linux
          - name: Nightly macOS Apple Silicon smoke
            os: macos-14
            ort_target: aarch64-apple-darwin
            artifact_prefix: nightly-separation-smoke-aarch64-apple
          - name: Nightly macOS Intel smoke
            os: macos-15-intel
            ort_target: x86_64-apple-darwin
            artifact_prefix: nightly-separation-smoke-x86_64-apple
    uses: ./.github/workflows/reusable-separation-smoke.yml
    with:
      name: ${{ matrix.name }}
      os: ${{ matrix.os }}
      ort_target: ${{ matrix.ort_target }}
      artifact_prefix: ${{ matrix.artifact_prefix }}
      retention_days: 7

  windows-installed-app:
    name: Windows installed app smoke
    uses: ./.github/workflows/reusable-windows-installed-app.yml
    with:
      openkara_version: "0.0.0-nightly"
      artifact_prefix: nightly-windows-installed-app
      scenario: clean-install
      previous_version: none
      retention_days: 7

  macos-installed-app:
    name: macOS installed app smoke (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            os: macos-14
            rust_target: aarch64-apple-darwin
            tauri_target: aarch64-apple-darwin
            artifact_prefix: nightly-macos-installed-app-aarch64
          - name: Intel
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
            tauri_target: x86_64-apple-darwin
            artifact_prefix: nightly-macos-installed-app-x86_64
    uses: ./.github/workflows/reusable-macos-installed-app-smoke.yml
    with:
      openkara_version: "0.0.0-nightly"
      artifact_prefix: ${{ matrix.artifact_prefix }}
      os: ${{ matrix.os }}
      rust_target: ${{ matrix.rust_target }}
      tauri_target: ${{ matrix.tauri_target }}
      scenario: clean-install
      previous_version: none
      retention_days: 7

  linux-installed-app:
    name: Linux installed app smoke
    uses: ./.github/workflows/reusable-linux-installed-app-smoke.yml
    with:
      openkara_version: "0.0.0-nightly"
      artifact_prefix: nightly-linux-installed-app-x86_64
      os: ubuntu-22.04
      rust_target: x86_64-unknown-linux-gnu
      tauri_target: x86_64-unknown-linux-gnu
      scenario: clean-install
      previous_version: none
      retention_days: 7

  aggregate-reports:
    name: Aggregate nightly reports
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - windows-matrix
      - separation-smoke
      - windows-installed-app
      - macos-installed-app
      - linux-installed-app
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all nightly reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/nightly-reports
          pattern: nightly-*

      - name: Aggregate reports
        shell: pwsh
        env:
          REPORTS_DIR: ${{ runner.temp }}/nightly-reports
        run: |
          $ErrorActionPreference = "Stop"
          $aggregate = @()

          $validationFiles = Get-ChildItem -Path $env:REPORTS_DIR -Recurse -Filter "installed-app-smoke-validation.json"
          foreach ($file in $validationFiles) {
            $validation = Get-Content $file.FullName | ConvertFrom-Json
            $aggregate += [ordered]@{
              kind = "windows-installed-app"
              path = $file.FullName
              pass_count = $validation.pass_count
              fail_count = $validation.fail_count
              total = $validation.assertions.Count
            }
          }

          $localAudioFiles = Get-ChildItem -Path $env:REPORTS_DIR -Recurse -Filter "local-audio-smoke-report.json"
          foreach ($file in $localAudioFiles) {
            $report = Get-Content $file.FullName | ConvertFrom-Json
            $aggregate += [ordered]@{
              kind = "local-audio-smoke"
              path = $file.FullName
              separation_passed = $report.summary.separation_passed
              separation_failed = $report.summary.separation_failed
            }
          }

          $aggregate | ConvertTo-Json -AsArray -Depth 10 | Set-Content -Path "nightly-aggregate.json" -Encoding utf8

      - name: Upload nightly aggregate
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-aggregate
          path: nightly-aggregate.json
          if-no-files-found: warn
          retention-days: 7
