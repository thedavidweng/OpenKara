name: Nightly hardening

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-hardening-${{ github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PNPM_CONFIG_MANAGE_PACKAGE_MANAGER_VERSIONS: "false"

jobs:
  windows-matrix:
    name: Windows UI ${{ matrix.test }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: accessibility
          - test: smoke
          - test: ui
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Vite+ and Node.js
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: lts/*
          version: 1.4.0
          run-install: false
          cache: true

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium webkit

      - name: Run ${{ matrix.test }} tests
        shell: pwsh
        env:
          TEST_TYPE: ${{ matrix.test }}
          OKA_ACCESSIBILITY_MATRIX: ${{ matrix.test == 'accessibility' && '1' || '0' }}
        run: |
          switch ($env:TEST_TYPE) {
            "accessibility" { pnpm test:a11y:matrix }
            "smoke" { pnpm exec playwright test --project=chromium-smoke --project=webkit-smoke }
            "ui" { pnpm exec playwright test --project=chromium-ui --project=webkit-ui }
            default { throw "Unknown test type: $env:TEST_TYPE" }
          }

      - name: Upload ${{ matrix.test }} report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-windows-ui-${{ matrix.test }}
          path: playwright-report
          if-no-files-found: error
          retention-days: 7

  # Full quality matrix (docs/CI_LAYERS.md). Release reuses recent green
  # Nightly evidence and only re-runs product packaging + Windows #284 core.
  separation-smoke:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Nightly Linux x64 smoke
            os: ubuntu-22.04
            ort_target: x86_64-unknown-linux-gnu
            artifact_prefix: nightly-separation-smoke-x86_64-linux
          - name: Nightly Linux arm64 smoke
            os: ubuntu-24.04-arm
            ort_target: aarch64-unknown-linux-gnu
            artifact_prefix: nightly-separation-smoke-aarch64-linux
          - name: Nightly macOS Apple Silicon smoke
            os: macos-14
            ort_target: aarch64-apple-darwin
            artifact_prefix: nightly-separation-smoke-aarch64-apple
          - name: Nightly macOS Intel smoke
            os: macos-15-intel
            ort_target: x86_64-apple-darwin
            artifact_prefix: nightly-separation-smoke-x86_64-apple
    uses: $/.github/workflows/reusable-separation-smoke.yml
    with:
      name: ${{ matrix.name }}
      os: ${{ matrix.os }}
      ort_target: ${{ matrix.ort_target }}
      artifact_prefix: ${{ matrix.artifact_prefix }}
      retention_days: 7

  windows-installed-app:
    name: Windows installed app smoke
    uses: $/.github/workflows/reusable-windows-installed-app.yml
    with:
      openkara_version: "0.0.0-nightly"
      artifact_prefix: nightly-windows-installed-app
      driver_scenario: clean-install
      uia_scenario: keyboard-workflow
      run_keyboard_uia: true
      run_fault_injection: true
      run_runtime_bootstrap_regression: true
      run_display_matrix: true
      previous_version: none
      retention_days: 30

  macos-installed-app:
    name: macOS installed app smoke (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            os: macos-14
            rust_target: aarch64-apple-darwin
            tauri_target: aarch64-apple-darwin
            artifact_prefix: nightly-macos-installed-app-aarch64
          - name: Intel
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
            tauri_target: x86_64-apple-darwin
            artifact_prefix: nightly-macos-installed-app-x86_64
    uses: $/.github/workflows/reusable-macos-installed-app-smoke.yml
    with:
      openkara_version: "0.0.0-nightly"
      artifact_prefix: ${{ matrix.artifact_prefix }}
      os: ${{ matrix.os }}
      rust_target: ${{ matrix.rust_target }}
      tauri_target: ${{ matrix.tauri_target }}
      scenario: clean-install
      previous_version: none
      retention_days: 7

  linux-installed-app:
    name: Linux installed app smoke (x64)
    uses: $/.github/workflows/reusable-linux-installed-app-smoke.yml
    with:
      openkara_version: "0.0.0-nightly"
      artifact_prefix: nightly-linux-installed-app-x86_64
      os: ubuntu-22.04
      rust_target: x86_64-unknown-linux-gnu
      tauri_target: x86_64-unknown-linux-gnu
      scenario: clean-install
      previous_version: none
      retention_days: 7

  aggregate-reports:
    name: Create Nightly evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: always()
    needs:
      - windows-matrix
      - separation-smoke
      - windows-installed-app
      - macos-installed-app
      - linux-installed-app
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create commit-bound Nightly evidence
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          node scripts/ci/nightly-evidence.mjs create \
            --commit "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --needs-json "${NEEDS_JSON}" \
            --output nightly-evidence.json

      - name: Upload Nightly evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-evidence
          path: nightly-evidence.json
          if-no-files-found: error
          retention-days: 30

  backend-without-node:
    name: Build backend without Node or a source plugin
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Vite+ and Node.js
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: lts/*
          version: 1.4.0
          run-install: false
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1

      - name: Restore Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ github.workflow }}-ubuntu-22.04-release
          workspaces: ./src-tauri -> target
          cache-bin: false
          key: ubuntu-22.04-release

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            binutils \
            curl \
            file \
            patchelf \
            libasound2-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore ONNX Runtime cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/generated/onnxruntime
          key: onnxruntime-x86_64-unknown-linux-gnu-${{ hashFiles('scripts/prepare-onnx-runtime.mjs', 'src-tauri/catalog/release-manifest.json') }}

      - name: Prepare ONNX Runtime
        env:
          ORT_TARGET: x86_64-unknown-linux-gnu
        shell: bash
        run: node scripts/prepare-onnx-runtime.mjs --target "${ORT_TARGET}"

      - name: Build frontend assets
        run: pnpm build

      - name: Build backend without Node or a source plugin
        run: bash scripts/ci/build-backend-without-node.sh
