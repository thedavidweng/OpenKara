name: Reusable Windows installed app smoke

on:
  workflow_call:
    inputs:
      openkara_version:
        description: "OpenKara version to test"
        required: true
        type: string
      artifact_prefix:
        description: "Prefix for all uploaded artifacts"
        required: true
        type: string
      scenario:
        description: "Automation scenario name"
        required: false
        type: string
        default: "clean-install"
      retention_days:
        description: "Artifact retention in days"
        required: false
        type: number
        default: 14

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-installer:
    name: Build installer
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build NSIS release candidate
        shell: pwsh
        env:
          OPENKARA_VERSION: ${{ inputs.openkara_version }}
        run: |
          Write-Host "TODO: build NSIS installer for $env:OPENKARA_VERSION from src-tauri/target/release (pnpm install, pnpm tauri build --ci --bundles nsis --features automation-smoke --no-sign)"

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_prefix }}-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: ${{ inputs.retention_days }}

  clean-install:
    name: Clean install and smoke
    runs-on: windows-latest
    timeout-minutes: 90
    needs: build-installer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download candidate installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_prefix }}-installer
          path: ${{ runner.temp }}/installer

      - name: Install previous stable then upgrade to candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          Write-Host "TODO: download previous stable *setup.exe from $env:GH_REPO releases"
          Write-Host "TODO: install previous stable NSIS/MSI to $env:RUNNER_TEMP/OpenKara-installed-smoke"
          Write-Host "TODO: install candidate from ${{ runner.temp }}/installer/*setup.exe over the same directory"

      - name: Build automation driver
        shell: pwsh
        run: |
          Write-Host "TODO: build openkara_automation_driver.exe (cd src-tauri && cargo build --release --features automation-smoke --bin openkara_automation_driver)"

      - name: Run installed-app smoke
        shell: pwsh
        env:
          OPENKARA_SMOKE_EP: cpu
          OPENKARA_SCENARIO: ${{ inputs.scenario }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP "openkara-installed-app-smoke"
          $appData = Join-Path $root "app-data"
          $inputDir = Join-Path $root "input"
          $outputDir = Join-Path $root "output"
          Write-Host "TODO: create $appData, $inputDir, $outputDir and copy a test fixture into $inputDir"
          Write-Host "TODO: locate installed openkara.exe under $env:RUNNER_TEMP/OpenKara-installed-smoke"
          Write-Host "TODO: run openkara_automation_driver.exe --scenario $env:OPENKARA_SCENARIO --installed-exe <openkara.exe> --app-data-dir $appData --input-dir $inputDir --output-dir $outputDir"
          Write-Host "TODO: expect $outputDir/prepare/installed-app-smoke-report.json"
          Write-Host "TODO: expect $outputDir/restart/installed-app-smoke-report.json"
          Write-Host "TODO: expect $outputDir/automation-report.json"

      - name: Upload smoke reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_prefix }}-smoke-reports
          path: |
            ${{ runner.temp }}/openkara-installed-app-smoke/**/installed-app-smoke-report.json
            ${{ runner.temp }}/openkara-installed-app-smoke/**/automation-report.json
            ${{ runner.temp }}/openkara-installed-app-smoke/**/local-audio-smoke-report.*
            ${{ runner.temp }}/OpenKara-installed-smoke/**/openkara.exe
          if-no-files-found: warn
          retention-days: ${{ inputs.retention_days }}

  generate-report:
    name: Generate validation report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: clean-install
    permissions:
      contents: read
      # validate-installed-app-smoke.mjs appends to the GitHub step summary.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download smoke reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_prefix }}-smoke-reports
          path: ${{ runner.temp }}/smoke-reports

      - name: Validate installed app smoke
        run: |
          node scripts/validate-installed-app-smoke.mjs \
            "${{ runner.temp }}/smoke-reports/prepare/installed-app-smoke-report.json" \
            "${{ runner.temp }}/smoke-reports/restart/installed-app-smoke-report.json" \
            "${{ runner.temp }}/smoke-reports"

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_prefix }}-validation
          path: ${{ runner.temp }}/smoke-reports/installed-app-smoke-validation.json
          if-no-files-found: warn
          retention-days: ${{ inputs.retention_days }}
