name: Reusable Windows installed app smoke

on:
  workflow_call:
    inputs:
      openkara_version:
        description: "Version label reported in the validation summary"
        required: true
        type: string
      artifact_prefix:
        description: "Prefix for all uploaded artifacts"
        required: true
        type: string
      scenario:
        description: "Automation scenario name"
        required: false
        type: string
        default: "clean-install"
      previous_version:
        description: "Previous release to install before the candidate (empty = latest stable, none = clean install only)"
        required: false
        type: string
        default: ""
      retention_days:
        description: "Artifact retention in days"
        required: false
        type: number
        default: 14
      release_build:
        description: "Build a signed release with updater artifacts"
        required: false
        type: boolean
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        description: "Minisign private key for updater artifacts"
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        description: "Password for the minisign private key"
        required: false
    outputs:
      validation_passed:
        description: "Whether the installed app validation passed"
        value: ${{ jobs.generate-report.outputs.validation_passed }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-installer:
    name: Build installer and driver
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.13.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Restore Rust cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: openkara-windows-release
          workspaces: ./src-tauri -> target
          cache-bin: false
          key: ${{ github.sha }}

      - name: Restore ONNX Runtime cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/generated/onnxruntime
          key: onnxruntime-x86_64-pc-windows-msvc-${{ hashFiles('scripts/prepare-onnx-runtime.mjs', 'src-tauri/catalog/release-manifest.json') }}

      - name: Prepare bundled ONNX Runtime
        shell: bash
        run: node scripts/prepare-onnx-runtime.mjs --target x86_64-pc-windows-msvc

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build NSIS release candidate with automation smoke entry point
        env:
          CI: true
          RELEASE_BUILD: ${{ inputs.release_build }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RELEASE_BUILD -eq "true") {
            pnpm tauri build --ci --bundles nsis --features automation-smoke --config src-tauri/tauri.release.conf.json
          } else {
            pnpm tauri build --ci --bundles nsis --features automation-smoke --no-sign
          }

      - name: Build automation driver
        run: cargo build --release --features automation-smoke --bin openkara_automation_driver

      - name: Build UIA probe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet build tools/windows-accessibility/OpenKara.AccessibilityProbe/OpenKara.AccessibilityProbe.csproj -c Release

      - name: Upload UIA probe
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_prefix }}-uia-probe
          path: tools/windows-accessibility/OpenKara.AccessibilityProbe/bin/Release/net8.0-windows/OpenKara.AccessibilityProbe.*
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

      - name: Upload installer
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_prefix }}-installer
          path: src-tauri/target/release/bundle/nsis/*setup.exe
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

      - name: Upload automation driver
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_prefix }}-driver
          path: src-tauri/target/release/openkara_automation_driver.exe
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

      - name: Upload Windows updater artifacts
        if: ${{ inputs.release_build }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_prefix }}-updater
          path: |
            src-tauri/target/release/bundle/**/latest.json
            src-tauri/target/release/bundle/**/*.sig
          if-no-files-found: warn
          retention-days: ${{ inputs.retention_days }}

  clean-install:
    name: Clean install and smoke
    runs-on: windows-latest
    timeout-minutes: 90
    needs: build-installer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Download candidate installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_prefix }}-installer
          path: ${{ runner.temp }}/installer

      - name: Download automation driver
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_prefix }}-driver
          path: ${{ runner.temp }}/driver

      - name: Install previous stable then upgrade to candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INSTALL_DIR: ${{ runner.temp }}/OpenKara-installed-smoke
          CANDIDATE_DIR: ${{ runner.temp }}/installer
          PREVIOUS_VERSION: ${{ inputs.previous_version }}
        run: |
          $ErrorActionPreference = "Stop"

          $candidateInstaller = Get-ChildItem -Path $env:CANDIDATE_DIR -Filter "*setup.exe" -File | Select-Object -First 1
          if ($null -eq $candidateInstaller) {
            throw "The candidate NSIS installer was not produced."
          }

          New-Item -ItemType Directory -Force -Path $env:INSTALL_DIR | Out-Null

          $previousVersion = $env:PREVIOUS_VERSION
          if ($previousVersion -ne "none") {
            if ([string]::IsNullOrWhiteSpace($previousVersion)) {
              $release = gh api "repos/$env:GH_REPO/releases" --paginate --jq '[.[] | select(.draft == false and .prerelease == false)] | sort_by(.published_at) | last | .tag_name'
            } else {
              $release = $previousVersion
            }

            if (-not [string]::IsNullOrWhiteSpace($release) -and $release -ne "null") {
              $previousDir = Join-Path $env:RUNNER_TEMP "openkara-previous-release"
              New-Item -ItemType Directory -Force -Path $previousDir | Out-Null
              gh release download $release --repo $env:GH_REPO --pattern "*setup.exe" --dir $previousDir
              $previousInstaller = Get-ChildItem -Path $previousDir -Filter "*setup.exe" -File | Select-Object -First 1
              if ($null -ne $previousInstaller) {
                & $previousInstaller.FullName /S "/D=$env:INSTALL_DIR"
                if ($LASTEXITCODE -ne 0) { throw "Previous installer failed with exit code $LASTEXITCODE" }
              } else {
                Write-Warning "Release $release did not include a Windows NSIS installer; continuing with clean candidate install."
              }
            } else {
              Write-Warning "No previous version resolved; continuing with clean candidate install."
            }
          }

          & $candidateInstaller.FullName /S "/D=$env:INSTALL_DIR"
          if ($LASTEXITCODE -ne 0) { throw "Candidate installer failed with exit code $LASTEXITCODE" }

          $installedApp = Get-ChildItem -Path $env:INSTALL_DIR -Recurse -File |
            Where-Object { $_.Name -ieq "OpenKara.exe" } |
            Select-Object -First 1
          if ($null -eq $installedApp) {
            throw "OpenKara.exe was not found after the candidate install."
          }
          "OPENKARA_INSTALLED_APP=$($installedApp.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run installed-app scenario
        shell: pwsh
        env:
          OPENKARA_SMOKE_EP: cpu
          OPENKARA_SCENARIO: ${{ inputs.scenario }}
          SMOKE_ROOT: ${{ runner.temp }}/openkara-installed-app-smoke
        run: |
          $ErrorActionPreference = "Stop"
          $root = $env:SMOKE_ROOT
          $appData = Join-Path $root "app-data"
          $inputDir = Join-Path $root "input"
          $prepareOutput = Join-Path $root "prepare"
          $restartOutput = Join-Path $root "restart"
          New-Item -ItemType Directory -Force -Path $appData, $inputDir, $prepareOutput, $restartOutput | Out-Null
          Copy-Item "src-tauri/tests/fixtures/audio/fixture.wav" (Join-Path $inputDir "fixture.wav")

          $driver = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP "driver") -Filter "openkara_automation_driver.exe" -File | Select-Object -First 1
          if ($null -eq $driver) { throw "Automation driver executable was not found." }

          & $driver.FullName --scenario $env:OPENKARA_SCENARIO --installed-exe $env:OPENKARA_INSTALLED_APP --app-data-dir $appData --input-dir $inputDir --output-dir $root
          if ($LASTEXITCODE -ne 0) { throw "Installed app scenario failed with exit code $LASTEXITCODE" }

      - name: Download UIA probe
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_prefix }}-uia-probe
          path: ${{ runner.temp }}/uia-probe

      - name: Run Windows desktop UIA E2E
        shell: pwsh
        env:
          OPENKARA_WINDOWS_INSTALL_DIR: ${{ runner.temp }}/OpenKara-installed-smoke
        run: |
          $ErrorActionPreference = "Stop"
          $probe = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP "uia-probe") -Filter "OpenKara.AccessibilityProbe.exe" -File | Select-Object -First 1
          if ($null -eq $probe) { throw "UIA probe executable was not found." }

          $installDir = $env:OPENKARA_WINDOWS_INSTALL_DIR
          & scripts/ci/run-windows-desktop-e2e.ps1 `
            -InstallDir $installDir `
            -Scenario installed-workflow `
            -OutputDir (Join-Path $env:RUNNER_TEMP "desktop-e2e") `
            -ProbePath $probe.FullName
          if ($LASTEXITCODE -ne 0) { throw "Windows desktop UIA E2E failed with exit code $LASTEXITCODE" }

      - name: Validate installed app smoke
        shell: pwsh
        env:
          SMOKE_ROOT: ${{ runner.temp }}/openkara-installed-app-smoke
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/validate-installed-app-smoke.mjs `
            (Join-Path $env:SMOKE_ROOT "prepare/installed-app-smoke-report.json") `
            (Join-Path $env:SMOKE_ROOT "restart/installed-app-smoke-report.json") `
            $env:SMOKE_ROOT

      - name: Upload smoke reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_prefix }}-smoke-reports
          path: |
            ${{ runner.temp }}/openkara-installed-app-smoke/**/installed-app-smoke-report.json
            ${{ runner.temp }}/openkara-installed-app-smoke/**/installed-app-smoke-validation.json
            ${{ runner.temp }}/openkara-installed-app-smoke/**/automation-report.json
            ${{ runner.temp }}/openkara-installed-app-smoke/**/local-audio-smoke-report.*
            ${{ runner.temp }}/OpenKara-installed-smoke/**/OpenKara.exe
            ${{ runner.temp }}/desktop-e2e/desktop-e2e-report.json
            ${{ runner.temp }}/desktop-e2e/uia-tree-*.json
          if-no-files-found: warn
          retention-days: ${{ inputs.retention_days }}

  generate-report:
    name: Generate validation report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: clean-install
    outputs:
      validation_passed: ${{ steps.summarize.outputs.passed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download smoke reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_prefix }}-smoke-reports
          path: ${{ runner.temp }}/smoke-reports

      - name: Summarize validation
        id: summarize
        shell: pwsh
        env:
          SMOKE_REPORTS_DIR: ${{ runner.temp }}/smoke-reports
        run: |
          $ErrorActionPreference = "Stop"
          $validationPath = Join-Path $env:SMOKE_REPORTS_DIR "installed-app-smoke-validation.json"
          if (-not (Test-Path $validationPath)) {
            $validationPath = Join-Path $env:SMOKE_REPORTS_DIR "openkara-installed-app-smoke/installed-app-smoke-validation.json"
          }
          if (-not (Test-Path $validationPath)) {
            throw "Validation report not found at $validationPath"
          }

          $validation = Get-Content $validationPath | ConvertFrom-Json
          $pass = ($validation.fail_count -eq 0) ? "true" : "false"
          "passed=$pass" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "# Installed-app smoke validation"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Total: $($validation.pass_count) passed, $($validation.fail_count) failed, $($validation.assertions.Count) assertions."
          if ($validation.fail_count -gt 0) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Failures"
            foreach ($assertion in $validation.assertions | Where-Object { $_.result -eq "fail" }) {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- ``$($assertion.id)``: expected ``$($assertion.expected)``; observed ``$($assertion.observed)``"
            }
          }
