name: Apply issue 284 runtime patch v2

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/284-runtime-bootstrap-termination'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Patch runtime bootstrap integration
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src-tauri/src/commands/runtime_bootstrap.rs')
          text = path.read_text()

          marker = 'fn download_runtime_source(\n'
          helper = '''fn report_post_download_progress(
              status: &Arc<Mutex<RuntimeBootstrapStatusSnapshot>>,
              emit: &mut impl FnMut(&'static str, RuntimeBootstrapStatusSnapshot),
              base: &RuntimeBootstrapStatusSnapshot,
              state: RuntimeBootstrapState,
          ) {
              let snapshot = RuntimeBootstrapStatusSnapshot {
                  state,
                  downloaded_bytes: None,
                  total_bytes: None,
                  error: None,
                  ..base.clone()
              };
              store_snapshot(status, snapshot.clone());
              emit(RUNTIME_BOOTSTRAP_PROGRESS_EVENT, snapshot);
          }

          '''
          if 'fn report_post_download_progress(' not in text:
              text = text.replace(marker, helper + marker, 1)

          function_start = text.index('pub fn install_and_load_runtime_blocking(')
          block_start = text.index(
              '    let installed = runtime_bootstrap::install_runtime_artifact(',
              function_start,
          )
          activation = '    runtime_bootstrap::activate_first_install(app_data_dir, &installed.record.artifact_id)?;\n'
          block_end = text.index(activation, block_start) + len(activation)

          replacement = '''    let embedded = catalog::embedded_catalog();
              let use_worker = catalog.generation == embedded.generation
                  && catalog.release_id == embedded.release_id;

              let installed = if use_worker {
                  crate::commands::runtime_worker::install_first_runtime(
                      app_data_dir,
                      |progress, download_complete| {
                          if download_complete {
                              report_post_download_progress(
                                  status,
                                  emit,
                                  &base,
                                  RuntimeBootstrapState::Downloading,
                              );
                          } else {
                              report_download_progress(
                                  status,
                                  emit,
                                  &base,
                                  RuntimeBootstrapState::Downloading,
                                  progress.downloaded_bytes,
                                  progress.total_bytes,
                              );
                          }
                      },
                  )?
              } else {
                  let installed = runtime_bootstrap::install_runtime_artifact(
                      app_data_dir,
                      runtime,
                      catalog,
                      |downloaded_bytes, total_bytes| {
                          if total_bytes.is_some_and(|total| total > 0 && downloaded_bytes >= total) {
                              report_post_download_progress(
                                  status,
                                  emit,
                                  &base,
                                  RuntimeBootstrapState::Downloading,
                              );
                          } else {
                              report_download_progress(
                                  status,
                                  emit,
                                  &base,
                                  RuntimeBootstrapState::Downloading,
                                  downloaded_bytes,
                                  total_bytes,
                              );
                          }
                      },
                  )?;

                  crate::separator::model::ensure_runtime_loaded_from_path(&installed.library_path)
                      .with_context(|| {
                          format!(
                              "failed to load ONNX Runtime from {}",
                              installed.library_path.display()
                          )
                      })?;
                  runtime_bootstrap::activate_first_install(app_data_dir, &installed.record.artifact_id)?;
                  installed
              };

              if use_worker {
                  crate::separator::model::ensure_runtime_loaded_from_path(&installed.library_path)
                      .with_context(|| {
                          format!(
                              "failed to load proven ONNX Runtime from {}",
                              installed.library_path.display()
                          )
                      })?;
              }
          '''
          text = text[:block_start] + replacement + text[block_end:]
          path.write_text(text)
          PY
          rm -f .github/workflows/apply-fix-284.yml .github/workflows/apply-fix-284-v2.yml
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/commands/runtime_bootstrap.rs src-tauri/src/commands/runtime_worker.rs src-tauri/src/main.rs src-tauri/src/commands/mod.rs .github/workflows/apply-fix-284.yml .github/workflows/apply-fix-284-v2.yml
          git commit -m "fix(runtime): bound post-download bootstrap"
          git push origin HEAD:${{ github.head_ref }}
