name: Apply runtime and playback regression fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: agent-runtime-playback-fix
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.head_ref == 'agent/fix-runtime-and-playback-clock'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
          ref: agent/fix-runtime-and-playback-clock

      - name: Apply deterministic source patch
        run: |
          python3 scripts/agent-runtime-playback-fix.py
          python3 <<'PY'
          from pathlib import Path
          path = Path("src-tauri/src/separator/model.rs")
          text = path.read_text()
          start = text.index("pub fn resolve_runtime_library_path_for_tests(")
          end = text.index("pub(crate) fn read_model_runtime_metadata", start)
          path.write_text(text[:start] + text[end:])
          PY

      - name: Prepare model and runtime test fixtures
        run: bash scripts/setup.sh

      - name: Format
        working-directory: src-tauri
        run: cargo fmt

      - name: Verify focused regressions
        working-directory: src-tauri
        shell: bash
        run: |
          set -o pipefail
          {
            cargo test -q audio::output::tests::resample_ratio_is_output_rate_over_input_rate
            cargo test -q commands::runtime_bootstrap
            cargo test -q separator::runtime_bootstrap
          } 2>&1 | tee /tmp/focused-regressions.log

      - name: Upload focused failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: focused-regressions-log
          path: /tmp/focused-regressions.log
          if-no-files-found: error
          retention-days: 1

      - name: Verify Rust suite
        working-directory: src-tauri
        run: cargo test -q

      - name: Verify clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Commit verified fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: restore playback clock and unify managed runtime"
          git push origin HEAD:agent/fix-runtime-and-playback-clock
