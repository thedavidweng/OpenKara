name: Dependabot auto-merge

# Official pattern: pull_request_target so GITHUB_TOKEN has write access on
# Dependabot PRs. Never checkout or execute PR code in this workflow.
# Safety model:
# - Dependabot cooldown delays version-update PRs (supply-chain window)
# - Only eligible non-major security updates bypass cooldown
# - CI/required checks still gate the actual merge when configured
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] Same-repository Dependabot metadata only; no checkout.

permissions: {}

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    name: Enable auto-merge
    if: >
      github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          alert-lookup: true

      - name: Enable auto-merge for safe updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          DEP_NAMES: ${{ steps.meta.outputs.dependency-names }}
          PKG_ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          DEP_TYPE: ${{ steps.meta.outputs.dependency-type }}
          ALERT_STATE: ${{ steps.meta.outputs.alert-state }}
        run: |
          set -euo pipefail
          # Only the release driver and this gate stay manual: a broken bump there
          # can change how every release is produced or how eligibility is decided.
          deny='googleapis/release-please-action dependabot/fetch-metadata'
          dep_names="${DEP_NAMES// /}"
          for blocked in $deny; do
            case ",${dep_names}," in
              *",${blocked},"*)
                echo "skip auto-merge (denylist): $blocked"
                exit 0
                ;;
            esac
          done

          eco="${PKG_ECOSYSTEM}"
          ut="${UPDATE_TYPE}"
          dt="${DEP_TYPE}"
          alert="${ALERT_STATE}"

          case "$ut" in
            version-update:semver-patch|version-update:semver-minor) ;;
            *) echo "major or unclassified updates require manual review"; exit 0 ;;
          esac

          eligible=false
          reason=""

          # Eligible non-major security updates bypass cooldown.
          if [ "$alert" = "OPEN" ] || [ "$alert" = "FIXED" ]; then
            eligible=true
            reason="security-update"
          fi

          # Patch updates after the cooldown window.
          if [ "$ut" = "version-update:semver-patch" ]; then
            eligible=true
            reason="semver-patch"
          fi

          # github-actions minor bumps (covers SHA pin bumps).
          if [ "$eco" = "github-actions" ] || [ "$eco" = "github_actions" ]; then
            if [ "$ut" = "version-update:semver-minor" ]; then
              eligible=true
              reason="github-actions-non-major"
            fi
          fi

          # Minor bumps of indirect or development dependencies.
          if [ "$ut" = "version-update:semver-minor" ] && [ "$dt" != "direct:production" ]; then
            eligible=true
            reason="${reason:-indirect-or-dev-minor}"
          fi

          if [ "$eligible" != true ]; then
            echo "skip auto-merge: ecosystem=$eco update-type=$ut dependency-type=$dt alert=$alert names=$DEP_NAMES"
            exit 0
          fi

          # Required-review rules cannot be satisfied by the bot unless the
          # repository allows Actions to approve. Approving here keeps human PRs
          # behind review while letting an eligible dependency bump merge itself.
          if gh pr view "$PR_URL" --json reviewDecision --jq '.reviewDecision' | grep -q REVIEW_REQUIRED; then
            gh pr review "$PR_URL" --approve --body "Automated approval: classified $reason update; CI still gates the merge."
          fi

          echo "enable auto-merge ($reason): ecosystem=$eco update-type=$ut dependency-type=$dt alert=$alert names=$DEP_NAMES"
          gh pr merge --auto --squash "$PR_URL"
