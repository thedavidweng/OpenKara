name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        type: string
      notes:
        description: "Extra release notes (appended after default text)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # read draft releases (release-please creates the release as a draft; the GitHub API hides drafts from tokens with only contents: read)
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_body: ${{ steps.notes.outputs.body }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Extract version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${EVENT_NAME}" = "push" ]; then
            tag="${GITHUB_REF#refs/tags/}"
            version="${tag#v}"
          else
            version="${INPUT_VERSION}"
            tag="v${version}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Verify package.json version matches release tag
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          if [ "${package_version}" != "${EXPECTED_VERSION}" ]; then
            echo "::error::Release ${RELEASE_TAG} expects version ${EXPECTED_VERSION}, but package.json is ${package_version}."
            echo "The published bundle takes its version from package.json (scripts/sync-version.mjs), so a tag that disagrees with package.json builds assets named OpenKara_${package_version}_* while the winget/flatpak manifests look for OpenKara_${EXPECTED_VERSION}_* and the release fails."
            echo "To fix: bump package.json to ${EXPECTED_VERSION}, run 'pnpm version:sync', commit, then re-tag that commit."
            exit 1
          fi
          echo "package.json version ${package_version} matches release ${RELEASE_TAG}."

      - name: Build release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          INPUT_NOTES: ${{ github.event.inputs.notes }}
        run: |
          set -euo pipefail

          # release-please creates the draft release with changelog notes.
          # Draft releases are hidden from the tag endpoint, so fall back to
          # the releases list (same pattern as scripts/release-metadata.mjs).
          if gh release view "${RELEASE_TAG}" --json body -q .body > RELEASE_NOTES.md 2>/dev/null; then
            echo "Found release for ${RELEASE_TAG} via tag endpoint"
          else
            release_body="$(gh api "repos/${GH_REPO}/releases" --paginate \
              --jq "[.[] | select(.tag_name == \"${RELEASE_TAG}\")] | .[0].body // empty" 2>/dev/null || true)"
            if [ -n "${release_body}" ]; then
              echo "${release_body}" > RELEASE_NOTES.md
              echo "Found draft release for ${RELEASE_TAG} via releases list"
            else
              echo "::warning::No release found for ${RELEASE_TAG}. Using minimal release notes."
              echo "## Release ${RELEASE_TAG}" > RELEASE_NOTES.md
            fi
          fi

          # Append installation section. Mirrors README "Install from Release"
          # so users can install straight from the GitHub Release page.
          cat >> RELEASE_NOTES.md <<'INSTALL_EOF'

          ---

          ## Installation

          Download the latest build for your platform from the assets below:

          | Platform              | Format                  |
          | --------------------- | ----------------------- |
          | macOS (Apple Silicon) | `.dmg`                  |
          | macOS (Intel)         | `.dmg`                  |
          | Windows               | `.exe` (NSIS installer) |
          | Linux                 | `.AppImage` / `.deb`    |

          **macOS (Homebrew):**

          ```bash
          brew install thedavidweng/tap/openkara
          ```

          **Windows (winget):**

          ```bash
          winget install thedavidweng.OpenKara
          ```

          **macOS Gatekeeper note:** If macOS says the app is damaged or can't be opened, run:

          ```bash
          xattr -rd com.apple.quarantine /Applications/OpenKara.app
          ```
          INSTALL_EOF

          {
            echo 'body<<RELEASE_NOTES_EOF'
            cat RELEASE_NOTES.md
            if [ -n "${INPUT_NOTES}" ]; then
              echo ""
              echo "---"
              echo "${INPUT_NOTES}"
            fi
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          retention-days: 5

  release-separation-smoke:
    # Native source-tree inference on the non-Windows targets with the exact
    # catalog runtime/model pair the release ships. Windows uses the stronger
    # installed-app lifecycle smoke below.
    name: Release separation smoke (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            ort_target: x86_64-unknown-linux-gnu
          - name: Linux arm64
            os: ubuntu-24.04-arm
            ort_target: aarch64-unknown-linux-gnu
          - name: macOS (Apple Silicon)
            os: macos-14
            ort_target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-15-intel
            ort_target: x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Restore Rust cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: ${{ github.workflow }}-${{ matrix.os }}-smoke
          workspaces: ./src-tauri -> target
          cache-bin: false
          key: ${{ matrix.os }}-smoke
          lookup-only: true # release workflow: restore only, never save

      - name: Install Linux smoke dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            libasound2-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - name: Download runtime and model
        shell: bash
        env:
          OPENKARA_ORT_TARGET: ${{ matrix.ort_target }}
        run: ./scripts/setup.sh

      - name: Record catalog artifact identities
        shell: bash
        run: |
          echo "Staged runtime:" && cat src-tauri/generated/onnxruntime/manifest.json
          echo "Pinned model:" && node scripts/resolve-model.mjs

      - name: Run real separation smoke
        shell: bash
        env:
          # Hosted runners have no GPU; pin the smoke to CPU so provider
          # fallback noise cannot make the run nondeterministic.
          OPENKARA_SMOKE_EP: cpu
        run: |
          set -euo pipefail

          input_dir="${RUNNER_TEMP}/openkara-smoke-input"
          output_dir="${RUNNER_TEMP}/openkara-smoke-output"
          mkdir -p "${input_dir}" "${output_dir}"
          cp src-tauri/tests/fixtures/audio/fixture.wav "${input_dir}/fixture.wav"

          ./scripts/run-local-smoke.sh "${input_dir}" "${output_dir}"

      - name: Validate real separation smoke report
        shell: bash
        run: |
          set -euo pipefail

          report_path="${RUNNER_TEMP}/openkara-smoke-output/local-audio-smoke-report.json"
          node --input-type=module - "${report_path}" <<'NODE'
          import { readFileSync } from "node:fs";

          const reportPath = process.argv[2];
          const report = JSON.parse(readFileSync(reportPath, "utf8"));
          const summary = report.summary;
          const failures = [];

          if (report.model.status !== "passed") {
            failures.push(`model status was ${report.model.status}`);
          }
          if (summary.discovered_files !== 1) {
            failures.push(`expected 1 discovered file, got ${summary.discovered_files}`);
          }
          if (summary.imported !== 1) {
            failures.push(`expected 1 imported file, got ${summary.imported}`);
          }
          if (summary.playback_failed !== 0) {
            failures.push(`playback_failed was ${summary.playback_failed}`);
          }
          if (summary.separation_passed < 1) {
            failures.push(`separation_passed was ${summary.separation_passed}`);
          }
          if (summary.separation_failed !== 0) {
            failures.push(`separation_failed was ${summary.separation_failed}`);
          }
          if (summary.separation_skipped !== 0) {
            failures.push(`separation_skipped was ${summary.separation_skipped}`);
          }

          const separatedSongs = report.songs.filter(
            (song) =>
              song.separation_status === "passed" &&
              song.accompaniment_path !== null &&
              song.vocals_path !== null,
          );
          if (separatedSongs.length < 1) {
            failures.push("no song produced both accompaniment and vocals artifacts");
          }

          if (failures.length > 0) {
            console.error(`Release separation smoke failed for ${reportPath}:`);
            for (const failure of failures) {
              console.error(`- ${failure}`);
            }
            process.exit(1);
          }

          console.log(
            `Release separation smoke passed: separation_passed=${summary.separation_passed}, separation_failed=${summary.separation_failed}, separation_skipped=${summary.separation_skipped}`,
          );
          NODE

      - name: Upload release separation smoke report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-separation-smoke-report-${{ matrix.ort_target }}
          path: |
            ${{ runner.temp }}/openkara-smoke-output/local-audio-smoke-report.*
            src-tauri/generated/onnxruntime/manifest.json
          if-no-files-found: warn
          retention-days: 14

  release-windows-installed-smoke:
    # This is deliberately release-only: it builds an NSIS candidate, installs
    # the preceding stable release and then the candidate, and runs the
    # installed executable through first-install + cold-restart separation.
    # The normal CI suite covers the fast contracts; this job is the expensive
    # end-user lifecycle proof and replaces the old duplicate Windows source
    # tree smoke matrix leg.
    name: Release Windows installed-app smoke
    runs-on: windows-latest
    timeout-minutes: 90
    needs: prepare-release
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.13.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Restore Rust cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: ${{ github.workflow }}-windows-installed-smoke
          workspaces: ./src-tauri -> target
          cache-bin: false
          key: windows-installed-smoke
          lookup-only: true # release workflow: restore only, never save

      - name: Restore ONNX Runtime cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/generated/onnxruntime
          key: onnxruntime-x86_64-pc-windows-msvc-${{ hashFiles('scripts/prepare-onnx-runtime.mjs', 'src-tauri/catalog/release-manifest.json') }}
          lookup-only: true # release workflow: restore only, never save

      - name: Prepare bundled ONNX Runtime
        shell: bash
        run: node scripts/prepare-onnx-runtime.mjs --target x86_64-pc-windows-msvc

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build NSIS release candidate with automation smoke entry point
        env:
          CI: true
        run: pnpm tauri build --ci --bundles nsis --features automation-smoke --no-sign

      - name: Install preceding stable release then release candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"
          $release = gh api "repos/$env:GH_REPO/releases" --paginate --jq '[.[] | select(.draft == false and .prerelease == false)] | sort_by(.published_at) | last | .tag_name'
          if ([string]::IsNullOrWhiteSpace($release) -or $release -eq "null") {
            throw "No preceding stable release is available for the Windows upgrade smoke."
          }

          $previousDir = Join-Path $env:RUNNER_TEMP "openkara-previous-release"
          New-Item -ItemType Directory -Force -Path $previousDir | Out-Null
          gh release download $release --repo $env:GH_REPO --pattern "*setup.exe" --dir $previousDir
          $previousInstaller = Get-ChildItem -Path $previousDir -Filter "*setup.exe" -File | Select-Object -First 1
          if ($null -eq $previousInstaller) {
            throw "Release $release did not include a Windows NSIS installer."
          }

          $candidateInstaller = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*setup.exe" -File | Select-Object -First 1
          if ($null -eq $candidateInstaller) {
            throw "The candidate NSIS installer was not produced."
          }

          $installDir = Join-Path $env:RUNNER_TEMP "OpenKara-installed-smoke"
          & $previousInstaller.FullName /S "/D=$installDir"
          if ($LASTEXITCODE -ne 0) { throw "Previous installer failed with exit code $LASTEXITCODE" }
          & $candidateInstaller.FullName /S "/D=$installDir"
          if ($LASTEXITCODE -ne 0) { throw "Candidate installer failed with exit code $LASTEXITCODE" }

          $installedApp = Get-ChildItem -Path $installDir -Recurse -File |
            Where-Object { $_.Name -ieq "OpenKara.exe" -or $_.Name -ieq "openkara.exe" } |
            Select-Object -First 1
          if ($null -eq $installedApp) {
            throw "OpenKara.exe was not found after the candidate upgrade install."
          }
          "OPENKARA_INSTALLED_APP=$($installedApp.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OPENKARA_INSTALLED_APP_DIR=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run clean app-data first-install and cold-restart smoke
        shell: pwsh
        env:
          OPENKARA_SMOKE_EP: cpu
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "openkara-installed-app-smoke"
          $appData = Join-Path $root "app-data"
          $inputDir = Join-Path $root "input"
          $prepareOutput = Join-Path $root "prepare"
          $restartOutput = Join-Path $root "restart"
          New-Item -ItemType Directory -Force -Path $inputDir, $prepareOutput, $restartOutput | Out-Null
          Copy-Item "src-tauri/tests/fixtures/audio/fixture.wav" (Join-Path $inputDir "fixture.wav")

          & $env:OPENKARA_INSTALLED_APP --automation-smoke prepare --app-data-dir $appData --input-dir $inputDir --output-dir $prepareOutput
          if ($LASTEXITCODE -ne 0) { throw "First-install app-data smoke failed with exit code $LASTEXITCODE" }
          & $env:OPENKARA_INSTALLED_APP --automation-smoke restart --app-data-dir $appData --input-dir $inputDir --output-dir $restartOutput
          if ($LASTEXITCODE -ne 0) { throw "Cold-restart separation smoke failed with exit code $LASTEXITCODE" }

          node scripts/validate-installed-app-smoke.mjs `
            (Join-Path $prepareOutput "installed-app-smoke-report.json") `
            (Join-Path $restartOutput "installed-app-smoke-report.json") `
            $restartOutput

      - name: Upload installed-app smoke reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-installed-app-smoke
          path: |
            ${{ runner.temp }}/openkara-installed-app-smoke/**/installed-app-smoke-report.json
            ${{ runner.temp }}/openkara-installed-app-smoke/**/installed-app-smoke-validation.json
            ${{ runner.temp }}/openkara-installed-app-smoke/restart/local-audio-smoke-report.*
            ${{ runner.temp }}/OpenKara-installed-smoke/**/OpenKara.exe
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Release (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    needs:
      [
        prepare-release,
        release-separation-smoke,
        release-windows-installed-smoke,
      ]
    permissions:
      contents: write # Needed by tauri-action to create the draft GitHub Release and upload assets.
    strategy:
      fail-fast: false
      # Serialize the matrix. tauri-action's uploadUpdaterJson does a
      # non-atomic read-modify-write of the release's single latest.json: it
      # downloads the current manifest, merges in this leg's platform entry, and
      # re-uploads. Run concurrently, two legs read the same base and the later
      # writer clobbers the earlier one's platform — the served latest.json
      # silently loses a target, and that OS's users never see the update.
      # Publishing one leg at a time closes that window (its only cost is a
      # longer, release-only wall time).
      max-parallel: 1
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-14
            args: --target aarch64-apple-darwin
            ort_target: aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          # Native Intel runner: the Intel app must be built, and its runtime
          # loaded, on the architecture it ships for — cross-compiling from
          # Apple Silicon proves neither. macos-15-intel is GitHub's supported
          # x86_64 image through August 2027; a self-hosted Intel replacement
          # must be established before hosted Intel runners retire.
          - name: macOS (Intel)
            os: macos-15-intel
            args: --target x86_64-apple-darwin
            ort_target: x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            args: ""
            ort_target: x86_64-pc-windows-msvc
            rust_targets: ""
          - name: Linux
            os: ubuntu-22.04
            args: ""
            ort_target: x86_64-unknown-linux-gnu
            rust_targets: ""

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.13.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false # release workflow: disable cache to prevent poisoning

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}

      - name: Restore Rust cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: ${{ github.workflow }}-${{ matrix.os }}-release
          workspaces: ./src-tauri -> target
          lookup-only: true # release workflow: restore only, never save

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            patchelf \
            libasound2-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Restore ONNX Runtime cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/generated/onnxruntime
          key: onnxruntime-${{ matrix.ort_target }}-${{ hashFiles('scripts/prepare-onnx-runtime.mjs', 'src-tauri/catalog/release-manifest.json') }}
          lookup-only: true # release workflow: restore only, never save

      - name: Prepare ONNX Runtime
        env:
          ORT_TARGET: ${{ matrix.ort_target }}
        shell: bash
        run: |
          node scripts/prepare-onnx-runtime.mjs --target "${ORT_TARGET}"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Build and publish release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENKARA_GOOGLE_DRIVE_OAUTH_CLIENT_JSON: ${{ secrets.OPENKARA_GOOGLE_DRIVE_OAUTH_CLIENT_JSON }}
          OPENKARA_DROPBOX_APP_KEY: ${{ secrets.OPENKARA_DROPBOX_APP_KEY }}
          OPENKARA_DROPBOX_APP_SECRET: ${{ secrets.OPENKARA_DROPBOX_APP_SECRET }}
          # In-app updater (#255): the minisign private key signs the updater
          # payloads. Its public half lives in tauri.conf.json
          # plugins.updater.pubkey — the two must be a pair, or the updater
          # rejects every download. Only this signed release build produces the
          # .sig files and latest.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.prepare-release.outputs.tag }}
          releaseName: OpenKara v${{ needs.prepare-release.outputs.version }}
          releaseBody: ${{ needs.prepare-release.outputs.release_body }}
          releaseDraft: true
          # Prerelease only for suffixed tags (v1.0.0-rc.1). GitHub's
          # /releases/latest — the URL the in-app updater polls — resolves only
          # the newest non-draft, non-prerelease release, so plain tags (v1.0.0)
          # must publish as full releases or the updater never sees them.
          prerelease: ${{ contains(needs.prepare-release.outputs.tag, '-') }}
          # DELIBERATE DIVERGENCE from the base config (#255): createUpdaterArtifacts
          # is NOT set in src-tauri/tauri.conf.json — OpenKara's verification
          # contract runs a full `pnpm tauri build` everywhere and PR CI must stay
          # keyless. The overlay flips it on for this signed release build only.
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
          tauriScript: pnpm tauri
        # No explicit latest.json upload step: tauri-action's uploadUpdaterJson
        # (default true) both uploads latest.json AND, on each subsequent matrix
        # job, downloads the release's existing latest.json and merges that
        # platform's signatures into it — so all targets accumulate into one
        # manifest. The publish matrix runs serially (max-parallel: 1 above), so
        # this read-modify-write cannot race and no platform is lost. A manual
        # `gh release upload --clobber` would overwrite the merge and strip every
        # other platform, so it is intentionally omitted.

  generate-checksums:
    name: Generate SHA256SUMS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [prepare-release, publish]
    permissions:
      contents: write # Needed to attach SHA256SUMS to the draft GitHub Release.
    steps:
      - name: Download release assets and generate SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p artifacts && cd artifacts
          gh release download "${RELEASE_TAG}" --pattern "OpenKara_*" --clobber
          files=(OpenKara_*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release assets found to checksum" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS
          gh release upload "${RELEASE_TAG}" SHA256SUMS --clobber

  prepare-distribution-manifests:
    name: Prepare distribution manifests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [prepare-release, publish, generate-checksums]
    permissions:
      contents: write # upload distribution manifests to the draft GitHub Release
    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ensure release source tag exists
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            tagged_sha="$(git rev-list -n 1 "${tag}")"
            if [ "${tagged_sha}" != "${GITHUB_SHA}" ]; then
              echo "::error::${tag} already points at ${tagged_sha}, expected ${GITHUB_SHA}."
              exit 1
            fi
            exit 0
          fi
          git tag "${tag}" "${GITHUB_SHA}"
          auth_header="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            push origin "refs/tags/${tag}"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false # release workflow: disable cache to prevent poisoning

      - name: Render WinGet manifests
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          node scripts/render-winget-manifests.mjs \
            --version "${RELEASE_VERSION}" \
            --output "${GITHUB_WORKSPACE}/dist/winget"

      - name: Render Flatpak manifests
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          node scripts/render-flatpak-manifest.mjs \
            --version "${RELEASE_VERSION}" \
            --output "${GITHUB_WORKSPACE}/dist/flatpak"

      - name: Upload WinGet manifest artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: winget-manifests
          path: dist/winget

      - name: Upload Flatpak manifest artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak-manifests
          path: dist/flatpak

  submit-winget-pr:
    name: Submit WinGet PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [prepare-release, prepare-distribution-manifests]
    if: ${{ vars.WINGET_FORK_REPO != '' }}

    steps:
      - name: Check WinGet automation bootstrap
        id: bootstrap
        env:
          GH_TOKEN: ${{ secrets.WINGET_PR_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::WINGET_PR_TOKEN is required when WINGET_FORK_REPO is configured."
            exit 1
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Download WinGet manifest artifact
        if: ${{ steps.bootstrap.outputs.ready == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: winget-manifests
          path: dist/winget

      - name: Create or update WinGet PR
        if: ${{ steps.bootstrap.outputs.ready == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.WINGET_PR_TOKEN }}
          WINGET_FORK_REPO: ${{ vars.WINGET_FORK_REPO }}
          WINGET_TARGET_REPO: ${{ vars.WINGET_TARGET_REPO || 'microsoft/winget-pkgs' }}
          WINGET_BASE_BRANCH: ${{ vars.WINGET_BASE_BRANCH || 'master' }}
          WINGET_PACKAGE_IDENTIFIER: ${{ vars.WINGET_PACKAGE_IDENTIFIER || 'thedavidweng.OpenKara' }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail

          branch="openkara/${VERSION}"
          fork_owner="${WINGET_FORK_REPO%%/*}"
          target_repo="${WINGET_TARGET_REPO}"
          base_branch="${WINGET_BASE_BRANCH}"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${WINGET_FORK_REPO}.git" winget-fork
          cd winget-fork
          git remote add upstream "https://github.com/${target_repo}.git"
          git fetch upstream "${base_branch}"
          git checkout -B "${branch}" "upstream/${base_branch}"

          mkdir -p manifests/t/thedavidweng/OpenKara
          cp -R ../dist/winget/t/thedavidweng/OpenKara/"${VERSION}" manifests/t/thedavidweng/OpenKara/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifests/t/thedavidweng/OpenKara/"${VERSION}"

          if git diff --cached --quiet; then
            echo "No WinGet manifest changes to submit"
            exit 0
          fi

          git commit -m "Add OpenKara ${VERSION}"
          git push origin "${branch}" --force

          pr_url="$(gh pr list --repo "${target_repo}" --head "${fork_owner}:${branch}" --json url --jq '.[0].url')"
          if [ -n "${pr_url}" ]; then
            echo "Existing WinGet PR: ${pr_url}"
            exit 0
          fi

          gh pr create \
            --repo "${target_repo}" \
            --base "${base_branch}" \
            --head "${fork_owner}:${branch}" \
            --title "New version: ${WINGET_PACKAGE_IDENTIFIER} version ${VERSION}" \
            --body "Automated WinGet manifest update for OpenKara ${VERSION}."

  submit-flathub-pr:
    name: Prepare or submit Flathub PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [prepare-release, prepare-distribution-manifests]
    if: ${{ vars.FLATHUB_FORK_REPO != '' }}

    steps:
      - name: Check Flathub automation bootstrap
        id: bootstrap
        env:
          GH_TOKEN: ${{ secrets.FLATHUB_PR_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::FLATHUB_PR_TOKEN is required when FLATHUB_FORK_REPO is configured."
            exit 1
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Download Flatpak manifest artifact
        if: ${{ steps.bootstrap.outputs.ready == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flatpak-manifests
          path: dist/flatpak

      - name: Prepare Flathub submission branch or update PR
        if: ${{ steps.bootstrap.outputs.ready == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.FLATHUB_PR_TOKEN }}
          FLATHUB_FORK_REPO: ${{ vars.FLATHUB_FORK_REPO }}
          FLATHUB_TARGET_REPO: ${{ vars.FLATHUB_TARGET_REPO || 'flathub/flathub' }}
          FLATHUB_BASE_BRANCH: ${{ vars.FLATHUB_BASE_BRANCH || 'new-pr' }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail

          app_id="io.github.thedavidweng.OpenKara"
          target_repo="${FLATHUB_TARGET_REPO}"
          base_branch="${FLATHUB_BASE_BRANCH}"
          fork_owner="${FLATHUB_FORK_REPO%%/*}"
          submission_mode="false"

          if [ "${target_repo}" = "flathub/flathub" ] && [ "${base_branch}" = "new-pr" ]; then
            submission_mode="true"
            branch="openkara-submission-${VERSION}"
            pr_title="Add ${app_id}"
          else
            branch="openkara/${VERSION}"
            pr_title="Update OpenKara ${VERSION}"
          fi

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${FLATHUB_FORK_REPO}.git" flathub-fork
          cd flathub-fork
          git remote add upstream "https://github.com/${target_repo}.git"
          git fetch upstream "${base_branch}"
          git checkout -B "${branch}" "upstream/${base_branch}"

          cp -R "../dist/flatpak/${app_id}/." .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .

          if git diff --cached --quiet; then
            echo "No Flathub manifest changes to submit"
            exit 0
          fi

          git commit -m "${pr_title}"
          git push origin "${branch}" --force

          pr_url="$(gh pr list --repo "${target_repo}" --head "${fork_owner}:${branch}" --json url --jq '.[0].url')"
          if [ -n "${pr_url}" ]; then
            echo "Existing Flathub PR: ${pr_url}"
            exit 0
          fi

          if [ "${submission_mode}" = "true" ]; then
            manual_submission_url="https://github.com/${target_repo}/compare/${base_branch}...${fork_owner}:${branch}?expand=1"
            echo "Initial Flathub submissions must be opened or updated manually: ${manual_submission_url}"
            exit 0
          fi

          gh pr create \
            --repo "${target_repo}" \
            --base "${base_branch}" \
            --head "${fork_owner}:${branch}" \
            --title "${pr_title}" \
            --body "Flatpak manifest update for OpenKara ${VERSION}."
