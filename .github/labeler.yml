# Auto-label PRs by changed-file path rules.
# Consumed by actions/labeler in the triage job (.github/workflows/ci.yml).
# Labels must already exist in the repo — labeler does not create them.

javascript:
  - changed-files:
      - any-glob-to-any-file:
          - "src/**"
          - "vite.config.ts"
          - "tsconfig.json"
          - "tsconfig.node.json"
          - "tsconfig.app.json"
          - "website/**"
          - "public/**"
          - "oxlintrc.json"
          - ".oxfmtrc.json"
          - "knip.json"
          - "index.html"
          - "scripts/**"
          - "tests/**"
          - "playwright.config.ts"

rust:
  - changed-files:
      - any-glob-to-any-file:
          - "src-tauri/**"
          - "rust-toolchain.toml"
          - "patches/**"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "**/*.md"
          - "website/**"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "pnpm-lock.yaml"
          - "package.json"
          - "src-tauri/Cargo.toml"
          - "src-tauri/Cargo.lock"
