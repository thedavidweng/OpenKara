<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090a" />
    <meta
      name="description"
      content="Answers to common questions about OpenKara."
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="/img/favicon-96x96.png"
    />
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg" />
    <link rel="shortcut icon" href="/img/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/img/apple-touch-icon.png"
    />
    <link rel="manifest" href="/img/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="OpenKara" />
    <title>FAQ | OpenKara</title>
    <script>
      (function () {
        var saved = localStorage.getItem("openkara-site-theme");
        var theme =
          saved === "light" || saved === "dark"
            ? saved
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta)
          meta.setAttribute(
            "content",
            theme === "dark" ? "#08090a" : "#f7f7f5",
          );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
