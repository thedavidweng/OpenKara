<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090a" />
    <meta
      name="description"
      content="Turn your music library into a karaoke stage with OpenKara."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OpenKara" />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="/img/favicon-96x96.png"
    />
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg" />
    <link rel="shortcut icon" href="/img/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/img/apple-touch-icon.png"
    />
    <link rel="manifest" href="/img/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="OpenKara" />
    <title>OpenKara | Your music, on your stage</title>
    <script>
      (function () {
        var savedTheme = localStorage.getItem("openkara-site-theme");
        var theme =
          savedTheme === "light" || savedTheme === "dark"
            ? savedTheme
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta)
          meta.setAttribute(
            "content",
            theme === "dark" ? "#08090a" : "#f7f7f5",
          );
        // Set <html lang> before paint so screen readers and search engines
        // see the right language. Saved preference wins; otherwise follow the
        // browser language. React syncs the attribute again after hydration.
        var savedLang = localStorage.getItem("openkara-site-language");
        var lang =
          savedLang === "en" || savedLang === "zh-CN"
            ? savedLang
            : navigator.language.toLowerCase().startsWith("zh")
              ? "zh-CN"
              : "en";
        document.documentElement.lang = lang;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
