overrides:
  esbuild: 0.28.2
  undici: ">=7.29.1 <8.0.0"
  nanoid: ">=3.3.17"
  postcss: ">=8.5.23"
  toml: ">=5.0.1"
  vite@*: "catalog:"
  vitest@*: "catalog:"

auditConfig:
  # picomatch <=4.0.7 ReDoS (GHSA-fc5q-39xc-vjpf) has no patched release yet.
  # picomatch is dev-only (fdir, tinyglobby, knip, vitest) and
  # never sees untrusted globs. Remove this entry once a fixed version ships.
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf

onlyBuiltDependencies:
  - esbuild

patchedDependencies:
  "@romanize/korean@0.1.3": patches/@romanize__korean@0.1.3.patch

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - lyric-romanizer@0.3.1
  - "@tanstack/react-virtual@3.14.22"
  - "@tanstack/virtual-core@3.19.7"
  - i18next@26.5.11
  - react-i18next@17.1.9

# Keep the lockfile readable by GitHub dependency graph and Flatpak tools.
pmOnFail: ignore
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vitest: 5.1.0
  vite-plus: 1.5.0
  "@vitest/coverage-v8": 5.1.0
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
