overrides:
  esbuild: 0.28.1
  undici: ">=7.28.0 <8.0.0"
  nanoid: ">=3.3.17"
  postcss: ">=8.5.23"
  toml: ">=4.1.2"

onlyBuiltDependencies:
  - esbuild
  - lefthook

patchedDependencies:
  "@romanize/korean@0.1.3": patches/@romanize__korean@0.1.3.patch

allowBuilds:
  esbuild: true
  lefthook: true

minimumReleaseAgeExclude:
  - lyric-romanizer@0.3.1

# Keep pnpm-lock.yaml as a single YAML document. pnpm 12 otherwise records
# packageManagerDependencies in a leading env document, which GitHub's
# dependency graph and other single-document consumers cannot read.
pmOnFail: ignore
