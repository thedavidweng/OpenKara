coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
    patch:
      default:
        target: 80%

  precision: 1
  round: down
  range: "60...100"

  ignore:
    # Tauri IPC thin wrappers — all are single-line invoke() calls;
    # testing them validates the Tauri framework, not our logic.
    - src/lib/tauri/cdg.ts
    - src/lib/tauri/library-setup.ts
    - src/lib/tauri/library.ts
    - src/lib/tauri/lyrics.ts
    - src/lib/tauri/maintenance.ts
    - src/lib/tauri/playback.ts
    - src/lib/tauri/playlist.ts
    - src/lib/tauri/remote-repository.ts
    - src/lib/tauri/separation.ts
    - src/lib/tauri/settings.ts
    # App entry point — bootstraps React + Tauri, not testable in jsdom.
    - src/main.tsx
    # Web Worker — requires worker runtime, not available in vitest/jsdom.
    - src/workers/romanize.worker.ts
    # Shared in-memory Tauri fake — a test double whose real exercise is
    # Playwright E2E and the website preview, not vitest.
    - src/mock/tauri-mock-impl.ts
    # Deep Tauri native API dependencies — require actual Tauri runtime
    # for meaningful coverage; unit-test mocks only test the mock.
    - src/runtime/window-shell-runtime.ts
    - src/runtime/theme-runtime.ts
    - src/lib/native-context-menu.ts
    # Heavy Tauri-dependent UI — tested by Playwright E2E, not vitest.
    - src/components/Library/ImportCdgChoiceDialog.tsx
    - src/components/Library/SongEditDialog.tsx
    - src/components/Library/SongPropertiesDialog.tsx
    - src/components/Library/ImportButton.tsx
    - src/components/Bootstrap/ModelBootstrapBanner.tsx
    - src/components/Cdg/CdgCanvas.tsx

flags:
  frontend:
    paths:
      - src/
    carryforward: true

component_management:
  individual_components:
    - component_id: frontend
      name: frontend
      paths:
        - src/**
    - component_id: rust
      name: rust
      paths:
        - src-tauri/**

comment:
  layout: "header, diff, flags, components, files"
  require_changes: true
