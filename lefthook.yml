pre-commit:
  parallel: true
  commands:
    oxfmt:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,json,css,md,html,yml,yaml}"
      # src-tauri is entirely in oxfmt's ignorePatterns, so it must not reach
      # oxfmt at all: given only ignored paths, oxfmt exits non-zero with
      # "Expected at least one target file" and blocks the commit (a catalog
      # snapshot bump stages nothing else). lefthook v2 matches `exclude` as
      # glob patterns — a regex here silently matches nothing, so keep these
      # as globs and let lefthook skip the command when nothing survives.
      exclude:
        - "pnpm-lock.yaml"
        - "src-tauri/**"
      # sh -c with positional args sidesteps word-splitting differences
      # between sh and zsh parents; zero args is a clean pass, which also
      # covers any future ignore rule that empties the list.
      run: 'sh -c ''[ $# -eq 0 ] || pnpm exec oxfmt "$@"'' -- {staged_files}'
      stage_fixed: true
    cargo-fmt:
      glob: "*.rs"
      run: cd src-tauri && cargo fmt
      stage_fixed: true
    knip:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,json}"
      exclude:
        - "pnpm-lock.yaml"
        - "src-tauri/**"
      run: pnpm knip --no-progress

# Mirrors CI checks (ci.yml) so local pushes fail the same way CI would.
# pre-commit formats staged files and runs knip. These checks verify the
# entire repo to catch files that slipped through a prior --no-verify or
# partial staging.
#
# Every command runs through skip-delete-only-push.sh: a push that only
# deletes remote refs transfers no commits, so there is nothing for these
# repo-wide gates to verify (use_stdin feeds the guard git's ref lines; a
# deletion is the zero local sha). Without the guard, deleting a stale branch
# cost a full coverage run — or a --no-verify reflex.
pre-push:
  parallel: true
  commands:
    format-check:
      use_stdin: true
      run: sh scripts/git-hooks/skip-delete-only-push.sh 'node --run format'
    cargo-fmt-check:
      use_stdin: true
      run: sh scripts/git-hooks/skip-delete-only-push.sh 'cd src-tauri && cargo fmt --check'
    lint:
      use_stdin: true
      run: sh scripts/git-hooks/skip-delete-only-push.sh 'node --run lint'
    knip:
      use_stdin: true
      run: sh scripts/git-hooks/skip-delete-only-push.sh 'pnpm knip --no-progress'
    standards-route:
      use_stdin: true
      run: sh scripts/git-hooks/skip-delete-only-push.sh 'node --run check:standards'
    patch-coverage:
      use_stdin: true
      run: sh scripts/git-hooks/skip-delete-only-push.sh 'pnpm test:coverage && pnpm check:patch-coverage'
