pre-commit:
  parallel: true
  commands:
    oxfmt:
      glob: "*.{ts,tsx,js,jsx,json,css,md,html,yml,yaml}"
      exclude: "pnpm-lock.yaml"
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true
    cargo-fmt:
      glob: "*.rs"
      run: cd src-tauri && cargo fmt
      stage_fixed: true

# Mirrors CI checks (ci.yml) so local pushes fail the same way CI would.
# pre-commit only formats staged files; these checks verify the entire repo
# to catch files that slipped through a prior --no-verify or partial staging.
pre-push:
  parallel: true
  commands:
    format-check:
      run: node --run format
    cargo-fmt-check:
      run: cd src-tauri && cargo fmt --check
    lint:
      run: node --run lint
    patch-coverage:
      run: pnpm test:coverage && pnpm check:patch-coverage
