pre-commit:
  parallel: true
  commands:
    oxfmt:
      glob: "*.{ts,tsx,js,jsx,json,css,md,html,yml,yaml}"
      exclude: "pnpm-lock.yaml"
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true
    cargo-fmt:
      glob: "*.rs"
      run: cd src-tauri && cargo fmt
      stage_fixed: true

# Mirrors Codecov patch status (codecov.yml target 80%) before the push reaches CI.
pre-push:
  commands:
    patch-coverage:
      run: pnpm test:coverage && pnpm check:patch-coverage
